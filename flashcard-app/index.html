<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="암기카드">
<title>최과학 암기 플래시카드</title>
<style>
  :root{
    --blue:#2563eb; --blue-d:#1d4ed8; --bg:#0f172a; --card:#ffffff;
    --ink:#0f172a; --muted:#64748b; --line:#e2e8f0; --soft:#f1f5f9;
    --green:#16a34a; --green-bg:#dcfce7; --red:#dc2626; --red-bg:#fee2e2;
    --amber:#d97706;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
    background:var(--soft); color:var(--ink); overscroll-behavior-y:contain;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;background:var(--soft)}
  header{
    background:var(--blue); color:#fff; padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;
    display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.12)
  }
  header .back{font-size:22px;line-height:1;background:none;border:none;color:#fff;cursor:pointer;padding:4px 6px;border-radius:8px}
  header .back:active{background:rgba(255,255,255,.18)}
  header h1{font-size:17px;margin:0;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .sub{font-size:12px;opacity:.85;font-weight:500}
  main{flex:1;padding:16px;display:flex;flex-direction:column;gap:12px}
  .muted{color:var(--muted)}
  .center{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:10px;text-align:center;color:var(--muted)}

  /* list tiles */
  .tile{
    background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 16px;
    cursor:pointer;display:flex;flex-direction:column;gap:6px;transition:transform .06s, box-shadow .15s;
    box-shadow:0 1px 2px rgba(0,0,0,.04)
  }
  .tile:active{transform:scale(.985)}
  .tile .t{font-size:16px;font-weight:700}
  .tile .d{font-size:13px;color:var(--muted)}
  .tile .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
  .pill{font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--soft);color:var(--muted)}
  .pill.ox{background:#eff6ff;color:var(--blue)}
  .pill.cd{background:#fef3c7;color:var(--amber)}
  .updated{font-size:12px;color:var(--muted);text-align:center;padding:4px}

  /* mode buttons */
  .modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mode{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 12px;text-align:center;cursor:pointer;
    display:flex;flex-direction:column;gap:8px;align-items:center;box-shadow:0 1px 2px rgba(0,0,0,.04)
  }
  .mode:active{transform:scale(.98)}
  .mode .ic{font-size:30px}
  .mode .nm{font-weight:700;font-size:15px}
  .mode .ct{font-size:12px;color:var(--muted)}

  /* progress */
  .bar{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
  .bar > i{display:block;height:100%;background:var(--blue);width:0;transition:width .25s}
  .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:600}

  /* OX quiz */
  .qcard{
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px 18px;
    font-size:19px;line-height:1.55;font-weight:600;min-height:140px;display:flex;align-items:center;
    box-shadow:0 1px 3px rgba(0,0,0,.05);word-break:keep-all
  }
  .qnum{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:8px}
  .oxbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .oxbtn{
    border:2px solid var(--line);background:var(--card);border-radius:18px;padding:24px 0;font-size:34px;font-weight:800;cursor:pointer;
    transition:transform .06s
  }
  .oxbtn:active{transform:scale(.96)}
  .oxbtn.o{color:var(--green)} .oxbtn.x{color:var(--red)}
  .feedback{border-radius:16px;padding:16px;font-size:15px;line-height:1.6;word-break:keep-all}
  .feedback.ok{background:var(--green-bg);border:1px solid #86efac}
  .feedback.no{background:var(--red-bg);border:1px solid #fca5a5}
  .feedback .head{font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}
  .feedback .exp{color:#334155}

  /* flashcard */
  .flip{perspective:1400px;flex:1;min-height:330px;display:flex}
  .flip-inner{position:relative;width:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .flip.flipped .flip-inner{transform:rotateY(180deg)}
  .face{
    position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;
    display:flex;flex-direction:column;box-shadow:0 4px 16px rgba(0,0,0,.07)
  }
  .face .tag{font-size:12px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}
  .face.front .tag{color:var(--blue)} .face.back .tag{color:var(--green)}
  .face .body{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;
    font-size:20px;line-height:1.6;font-weight:600;word-break:keep-all;overflow-y:auto}
  .face.back{transform:rotateY(180deg)}
  .face.back .body{font-size:18px;font-weight:500;color:#1e293b}
  .face .hint{font-size:12px;color:var(--muted);text-align:center}
  .nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  .btn{
    border:none;border-radius:14px;padding:15px;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;
    background:var(--blue);color:#fff;transition:transform .06s
  }
  .btn:active{transform:scale(.98)}
  .btn.sec{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--blue)}
  .btn:disabled{opacity:.4;cursor:default}
  .toolbar{display:flex;gap:8px}
  .toolbar .btn{flex:1;padding:11px;font-size:13px;border-radius:11px}

  .result{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 20px;text-align:center;display:flex;flex-direction:column;gap:14px}
  .result .score{font-size:46px;font-weight:800;color:var(--blue)}
  .result .lbl{color:var(--muted);font-size:14px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;z-index:50;pointer-events:none}
  .toast.show{opacity:.95}
  .off{font-size:12px;background:#fef3c7;color:#92400e;text-align:center;padding:6px;border-radius:10px;display:none}
  .switch{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);font-weight:600;cursor:pointer;user-select:none}
  .switch input{width:38px;height:22px;appearance:none;background:var(--line);border-radius:999px;position:relative;transition:.2s;cursor:pointer}
  .switch input:checked{background:var(--blue)}
  .switch input::after{content:"";position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.2s}
  .switch input:checked::after{left:18px}
</style>
</head>
<body>
<div id="app">
  <header>
    <button class="back" id="back" style="display:none">‹</button>
    <div style="flex:1;min-width:0">
      <h1 id="title">최과학 암기 플래시카드</h1>
      <div class="sub" id="subtitle">과목별 OX · 플래시카드</div>
    </div>
  </header>
  <div class="off" id="off">오프라인 - 저장된 내용으로 학습 중</div>
  <main id="main"><div class="center">불러오는 중…</div></main>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
const $ = (s)=>document.querySelector(s);
const main=$("#main"), titleEl=$("#title"), subEl=$("#subtitle"), backEl=$("#back");
const LS = {
  get:(k,d)=>{try{return JSON.parse(localStorage.getItem("fc_"+k))??d}catch(e){return d}},
  set:(k,v)=>{try{localStorage.setItem("fc_"+k,JSON.stringify(v))}catch(e){}}
};
let INDEX=null, SET=null, stack=[];

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("show"),1400)}
function setHeader(t,s,canBack){titleEl.textContent=t;subEl.textContent=s||"";backEl.style.display=canBack?"block":"none"}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

async function loadJSON(url){const r=await fetch(url,{cache:"no-cache"});if(!r.ok)throw new Error(url);return r.json()}

// ---------- screens ----------
function go(fn){stack.push(fn);fn()}
function back(){stack.pop();const prev=stack[stack.length-1];if(prev)prev();}
backEl.onclick=back;

async function screenSets(){
  setHeader(INDEX.appTitle||"암기 플래시카드","학습할 교재를 선택하세요",false);
  main.innerHTML="";
  INDEX.sets.forEach(s=>{
    const el=document.createElement("div");el.className="tile";
    el.innerHTML=`<div class="t">${s.title}</div><div class="d">${s.desc||""}</div><div class="row"><span class="pill">업데이트 ${s.date||""}</span></div>`;
    el.onclick=()=>openSet(s);
    main.appendChild(el);
  });
  const note=document.createElement("div");note.className="updated";
  note.textContent="📲 홈 화면에 추가하면 앱처럼 사용할 수 있어요";
  main.appendChild(note);
}

async function openSet(s){
  main.innerHTML='<div class="center">불러오는 중…</div>';
  try{ SET=await loadJSON(s.file); SET._meta=s; }
  catch(e){ main.innerHTML='<div class="center">데이터를 불러오지 못했어요.<br>인터넷 연결 후 다시 시도하세요.</div>'; return; }
  go(screenUnits);
}

function countOf(u){return u.ox.length+u.cards.length}

function screenUnits(){
  setHeader(SET.title, SET.subtitle||"", true);
  main.innerHTML="";
  // whole-set quick actions
  const quick=document.createElement("div");quick.className="modes";
  quick.innerHTML=`
    <div class="mode" id="allox"><div class="ic">⭕❌</div><div class="nm">전체 OX 퀴즈</div><div class="ct">${SET.units.reduce((a,u)=>a+u.ox.length,0)}문제</div></div>
    <div class="mode" id="allcd"><div class="ic">🃏</div><div class="nm">전체 플래시카드</div><div class="ct">${SET.units.reduce((a,u)=>a+u.cards.length,0)}장</div></div>`;
  main.appendChild(quick);
  quick.querySelector("#allox").onclick=()=>{const all=[];SET.units.forEach(u=>u.ox.forEach(o=>all.push(o)));startOX("전체 OX 퀴즈",all)};
  quick.querySelector("#allcd").onclick=()=>{const all=[];SET.units.forEach(u=>u.cards.forEach(c=>all.push(c)));startCards("전체 플래시카드",all)};

  const h=document.createElement("div");h.className="meta";h.style.marginTop="6px";h.innerHTML="<span>단원별 학습</span>";main.appendChild(h);

  SET.units.forEach(u=>{
    const el=document.createElement("div");el.className="tile";
    el.innerHTML=`<div class="t">${u.name}</div><div class="row">
      <span class="pill ox">OX ${u.ox.length}</span>
      <span class="pill cd">카드 ${u.cards.length}</span></div>`;
    el.onclick=()=>go(()=>screenModes(u));
    main.appendChild(el);
  });
}

function screenModes(u){
  setHeader(u.name, "학습 방법 선택", true);
  main.innerHTML="";
  const m=document.createElement("div");m.className="modes";
  m.innerHTML=`
    <div class="mode" id="ox"><div class="ic">⭕❌</div><div class="nm">OX 퀴즈</div><div class="ct">${u.ox.length}문제</div></div>
    <div class="mode" id="cd"><div class="ic">🃏</div><div class="nm">플래시카드</div><div class="ct">${u.cards.length}장</div></div>`;
  main.appendChild(m);
  const oxBtn=m.querySelector("#ox"), cdBtn=m.querySelector("#cd");
  if(!u.ox.length){oxBtn.style.opacity=.4;oxBtn.onclick=()=>toast("이 단원엔 OX 문제가 없어요")}
  else oxBtn.onclick=()=>startOX(u.name,u.ox);
  if(!u.cards.length){cdBtn.style.opacity=.4;cdBtn.onclick=()=>toast("이 단원엔 카드가 없어요")}
  else cdBtn.onclick=()=>startCards(u.name,u.cards);

  const tip=document.createElement("div");tip.className="updated";
  tip.innerHTML="OX 퀴즈는 함정 문장의 참·거짓을 판단하고, 플래시카드는 카드를 눌러 정답을 확인해요.";
  main.appendChild(tip);
}

// ---------- OX quiz ----------
function startOX(name, items){
  if(!items.length){toast("문제가 없어요");return}
  const order=LS.get("shuffle",true)?shuffle(items):items.slice();
  let i=0, correct=0, wrong=[];
  function render(){
    setHeader(name,"OX 퀴즈",true);
    const it=order[i];
    main.innerHTML="";
    const meta=document.createElement("div");meta.className="meta";
    meta.innerHTML=`<span>${i+1} / ${order.length}</span><span>맞음 ${correct}</span>`;
    const bar=document.createElement("div");bar.className="bar";bar.innerHTML=`<i style="width:${(i)/order.length*100}%"></i>`;
    const q=document.createElement("div");q.className="qcard";
    q.innerHTML=`<div><div class="qnum">${it.n}번</div>${it.q}</div>`;
    const btns=document.createElement("div");btns.className="oxbtns";
    btns.innerHTML=`<button class="oxbtn o">O</button><button class="oxbtn x">X</button>`;
    main.append(meta,bar,q,btns);
    btns.querySelector(".o").onclick=()=>answer("O");
    btns.querySelector(".x").onclick=()=>answer("X");

    function answer(choice){
      const right = choice===it.a;
      if(right)correct++; else wrong.push(it);
      const fb=document.createElement("div");fb.className="feedback "+(right?"ok":"no");
      fb.innerHTML=`<div class="head">${right?"✅ 정답":"❌ 오답"} · 답은 <b style="font-size:18px">${it.a}</b></div>`+
        (it.e?`<div class="exp">${it.e}</div>`:`<div class="exp">${it.a==="O"?"옳은 문장입니다.":"틀린 문장입니다."}</div>`);
      const next=document.createElement("button");next.className="btn";next.style.marginTop="4px";
      next.textContent = (i<order.length-1)?"다음 ›":"결과 보기";
      next.onclick=()=>{ if(i<order.length-1){i++;render()} else result(); };
      btns.querySelectorAll(".oxbtn").forEach(b=>b.disabled=true);
      main.append(fb,next);
      next.scrollIntoView({behavior:"smooth",block:"end"});
    }
  }
  function result(){
    setHeader(name,"결과",true);
    const pct=Math.round(correct/order.length*100);
    main.innerHTML="";
    const r=document.createElement("div");r.className="result";
    r.innerHTML=`<div class="lbl">${order.length}문제 중</div><div class="score">${correct}<span style="font-size:24px;color:var(--muted)"> / ${order.length}</span></div>
      <div class="lbl">정답률 ${pct}%</div>`;
    main.appendChild(r);
    if(wrong.length){
      const again=document.createElement("button");again.className="btn";again.textContent=`틀린 ${wrong.length}문제 다시 풀기`;
      again.onclick=()=>startOX(name,wrong);main.appendChild(again);
    }
    const retry=document.createElement("button");retry.className="btn sec";retry.textContent="처음부터 다시";
    retry.onclick=()=>startOX(name,items);main.appendChild(retry);
    const home=document.createElement("button");home.className="btn ghost";home.textContent="단원 목록";
    home.onclick=()=>{while(stack.length>1&&stack[stack.length-1]!==screenUnits)stack.pop();screenUnits()};
    main.appendChild(home);
  }
  stack.push(render);render();
}

// ---------- Flashcards ----------
function startCards(name, items){
  if(!items.length){toast("카드가 없어요");return}
  let order=LS.get("shuffle",true)?shuffle(items):items.slice();
  let i=0, flipped=false;
  function render(){
    setHeader(name,"플래시카드",true);
    const it=order[i];
    main.innerHTML="";
    const meta=document.createElement("div");meta.className="meta";
    meta.innerHTML=`<span>${i+1} / ${order.length}</span>
      <label class="switch">섞기<input type="checkbox" id="shf" ${LS.get("shuffle",true)?"checked":""}></label>`;
    const bar=document.createElement("div");bar.className="bar";bar.innerHTML=`<i style="width:${(i+1)/order.length*100}%"></i>`;
    const flip=document.createElement("div");flip.className="flip"+(flipped?" flipped":"");
    flip.innerHTML=`<div class="flip-inner">
        <div class="face front"><div class="tag">문제 · ${it.n}번</div><div class="body">${it.q}</div><div class="hint">카드를 눌러 정답 확인</div></div>
        <div class="face back"><div class="tag">정답 · 해설</div><div class="body">${it.a}</div><div class="hint">다시 누르면 문제</div></div>
      </div>`;
    flip.onclick=()=>{flipped=!flipped;flip.classList.toggle("flipped")};
    const nav=document.createElement("div");nav.className="nav";
    nav.innerHTML=`<button class="btn sec" id="prev">‹ 이전</button><button class="btn" id="next">${i<order.length-1?"다음 ›":"처음으로"}</button>`;
    const tools=document.createElement("div");tools.className="toolbar";
    tools.innerHTML=`<button class="btn sec" id="rsh">🔀 다시 섞기</button><button class="btn ghost" id="units">단원 목록</button>`;
    main.append(meta,bar,flip,nav,tools);

    meta.querySelector("#shf").onchange=(e)=>{LS.set("shuffle",e.target.checked);toast(e.target.checked?"섞기 켜짐 (다음부터 적용)":"섞기 꺼짐")};
    nav.querySelector("#prev").onclick=()=>{if(i>0){i--;flipped=false;render()}};
    nav.querySelector("#next").onclick=()=>{flipped=false;if(i<order.length-1){i++}else{i=0};render()};
    tools.querySelector("#rsh").onclick=()=>{order=shuffle(items);i=0;flipped=false;render();toast("새로 섞었어요")};
    tools.querySelector("#units").onclick=()=>{while(stack.length>1&&stack[stack.length-1]!==screenUnits)stack.pop();screenUnits()};
  }
  stack.push(render);render();
}

// ---------- boot ----------
(async function(){
  try{ INDEX=await loadJSON("data/index.json"); }
  catch(e){ main.innerHTML='<div class="center">목록을 불러오지 못했어요.<br>인터넷 연결 후 새로고침하세요.</div>'; return; }
  stack=[screenSets];screenSets();
})();

window.addEventListener("online",()=>{$("#off").style.display="none"});
window.addEventListener("offline",()=>{$("#off").style.display="block"});
if(!navigator.onLine)$("#off").style.display="block";

if("serviceWorker" in navigator){
  window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
}
</script>
</body>
</html>
