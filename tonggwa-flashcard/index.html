<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>최과학 암기 플래시카드</title>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --card2:#243044; --line:#334155;
    --text:#e2e8f0; --muted:#94a3b8; --accent:#3b82f6; --accent2:#2563eb;
    --ok:#22c55e; --no:#ef4444; --warn:#f59e0b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;}
  body{max-width:760px; margin:0 auto; padding:14px; min-height:100vh;}
  h1{font-size:19px; margin:4px 0 12px; display:flex; align-items:center; gap:8px;}
  h1 .tag{font-size:11px; background:var(--accent2); padding:3px 8px; border-radius:20px; font-weight:600;}
  .panel{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; margin-bottom:12px;}
  .panel h2{font-size:13px; color:var(--muted); margin:0 0 10px; font-weight:600; letter-spacing:.3px;}
  .row{display:flex; flex-wrap:wrap; gap:8px;}
  select,button{font-family:inherit; font-size:14px;}
  select{background:var(--card2); color:var(--text); border:1px solid var(--line);
    border-radius:10px; padding:9px 10px; flex:1; min-width:130px;}
  .chip{background:var(--card2); color:var(--text); border:1px solid var(--line);
    border-radius:20px; padding:7px 14px; cursor:pointer; font-size:13px; user-select:none; transition:.15s;}
  .chip.on{background:var(--accent2); border-color:var(--accent); color:#fff;}
  .btn{background:var(--accent2); color:#fff; border:none; border-radius:11px;
    padding:12px 16px; cursor:pointer; font-weight:600; font-size:15px;}
  .btn.ghost{background:var(--card2); border:1px solid var(--line); color:var(--text); font-weight:500;}
  .btn:active{transform:scale(.98);}
  .btn:disabled{opacity:.4; cursor:not-allowed;}
  .full{width:100%;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .units{max-height:34vh; overflow:auto; margin-top:4px;}
  .grp{font-size:12px; color:var(--muted); margin:10px 0 4px; font-weight:600;}
  .uitem{display:flex; align-items:center; gap:9px; padding:8px 6px; border-radius:8px; cursor:pointer;}
  .uitem:hover{background:var(--card2);}
  .uitem input{width:17px; height:17px; accent-color:var(--accent);}
  .uitem .cnt{margin-left:auto; font-size:11px; color:var(--muted); background:var(--card2); padding:1px 7px; border-radius:10px;}
  .uitem.empty{opacity:.5;}
  #study{display:none;}
  .meta{display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted); margin-bottom:8px; flex-wrap:wrap;}
  .pill{padding:2px 9px; border-radius:20px; font-size:11px; font-weight:600;}
  .pill.ox{background:#1e3a8a; color:#bfdbfe;}
  .pill.da{background:#134e4a; color:#99f6e4;}
  .pill.sa{background:#713f12; color:#fde68a;}
  .pill.d상{background:#7f1d1d; color:#fecaca;} .pill.d중{background:#78350f; color:#fde68a;} .pill.d하{background:#14532d; color:#bbf7d0;}
  .flash{background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:22px 18px; min-height:230px; display:flex; flex-direction:column;}
  .q{font-size:19px; line-height:1.6; flex:1;}
  .ans{border-top:1px dashed var(--line); margin-top:16px; padding-top:14px; display:none;}
  .ans.show{display:block;}
  .ans .label{font-size:12px; color:var(--muted); margin-bottom:4px;}
  .ans .val{font-size:17px; font-weight:600; margin-bottom:12px;}
  .ans .val.O{color:var(--ok);} .ans .val.X{color:var(--no);}
  .ans .exp{font-size:14px; line-height:1.6; color:#cbd5e1;}
  .controls{margin-top:12px;}
  .prog{height:6px; background:var(--card2); border-radius:6px; overflow:hidden; margin:10px 0;}
  .prog>div{height:100%; background:var(--accent); width:0;}
  .stat{font-size:12px; color:var(--muted); text-align:center; margin-top:6px;}
  .done{text-align:center; padding:30px 10px;}
  .done .big{font-size:40px; margin-bottom:8px;}
  .hide{display:none!important;}
  a.src{color:var(--muted); font-size:11px; text-decoration:none;}
  .empty-msg{text-align:center; color:var(--muted); padding:24px; font-size:14px;}
  #installBar{display:none; background:var(--card); border:1px solid var(--accent); border-radius:12px; padding:12px 14px; margin-bottom:12px; font-size:13px; position:relative;}
  #installBar .ttl{font-weight:600;}
  #installBar .steps{color:#cbd5e1; line-height:1.6; margin-top:6px;}
  #installBar b{color:#93c5fd;}
  #installBar .x{position:absolute; top:8px; right:12px; cursor:pointer; color:var(--muted); font-size:16px;}
</style>
</head>
<body>

<h1>📚 최과학 암기 플래시카드 <span class="tag">통합과학</span></h1>

<div id="installBar">
  <span class="x" onclick="dismissInstall()">✕</span>
  <div class="ttl">📱 홈 화면에 추가하면 앱처럼 쓸 수 있어요</div>
  <div class="steps" id="installSteps"></div>
</div>

<div id="setup">
  <div class="panel">
    <h2>1. 책 선택</h2>
    <div class="row" id="bookChips"></div>
  </div>
  <div class="panel">
    <h2>2. 단원 선택</h2>
    <div class="row" style="margin-bottom:6px;">
      <span class="chip" onclick="selectAll(true)">전체 선택</span>
      <span class="chip" onclick="selectAll(false)">전체 해제</span>
    </div>
    <div class="units" id="unitList"></div>
  </div>
  <div class="panel">
    <h2>3. 유형 &amp; 난이도</h2>
    <div class="row" style="margin-bottom:10px;">
      <span class="chip type on" data-type="전체">전체</span>
      <span class="chip type" data-type="OX">OX</span>
      <span class="chip type" data-type="단답형">단답형</span>
      <span class="chip type" data-type="서술형">서술형</span>
    </div>
    <div class="row">
      <span class="chip diff on" data-diff="상">상</span>
      <span class="chip diff on" data-diff="중">중</span>
      <span class="chip diff on" data-diff="하">하</span>
    </div>
  </div>
  <div class="panel">
    <div class="grid2" style="margin-bottom:8px;">
      <button class="btn ghost" onclick="loadWrongOnly()">⭐ 틀린 카드만</button>
      <button class="btn ghost" onclick="resetWrong()">틀린 기록 초기화</button>
    </div>
    <button class="btn full" onclick="start(false)">🔀 셔플 시작</button>
    <div class="stat" id="poolStat"></div>
  </div>
</div>

<div id="study">
  <div class="meta">
    <span id="mUnit"></span>
    <span class="pill" id="mType"></span>
    <span class="pill" id="mDiff"></span>
    <span id="mSrc" style="margin-left:auto;"></span>
  </div>
  <div class="prog"><div id="bar"></div></div>
  <div class="flash">
    <div class="q" id="qText"></div>
    <div class="ans" id="ansBox">
      <div class="label">정답</div>
      <div class="val" id="aVal"></div>
      <div class="label">해설</div>
      <div class="exp" id="aExp"></div>
    </div>
  </div>
  <div id="oxResult" class="hide" style="text-align:center;font-weight:700;font-size:17px;margin-bottom:10px;"></div>
  <div class="controls">
    <div class="grid2 hide" id="oxBox">
      <button class="btn ghost" style="border-color:var(--no);color:#fecaca;font-size:18px" onclick="answerOX('X')">✕ 틀리다</button>
      <button class="btn ghost" style="border-color:var(--ok);color:#bbf7d0;font-size:18px" onclick="answerOX('O')">○ 맞다</button>
    </div>
    <button class="btn full" id="revealBtn" onclick="reveal()">정답 확인</button>
    <div class="grid2 grade hide" id="gradeBox" style="margin-top:8px;">
      <button class="btn ghost" style="border-color:var(--no);color:#fecaca" onclick="grade(false)">✕ 모름/틀림</button>
      <button class="btn ghost" style="border-color:var(--ok);color:#bbf7d0" onclick="grade(true)">✓ 맞음</button>
    </div>
    <button class="btn full hide" id="nextBtn" style="margin-top:8px;" onclick="nextCard()">다음 →</button>
  </div>
  <div class="stat" id="studyStat"></div>
  <button class="btn ghost full" style="margin-top:14px;" onclick="quit()">← 단원 선택으로</button>
</div>

<script>
const STORE_WRONG = "choisci_wrong_v1";
let manifest=null, unitCache={}, pool=[], idx=0, revealed=false;
let session={correct:0, wrong:0};
let wrongSet = loadWrong();
function loadWrong(){ try{return new Set(JSON.parse(localStorage.getItem(STORE_WRONG)||"[]"));}catch(e){return new Set();} }
function saveWrong(){ try{localStorage.setItem(STORE_WRONG, JSON.stringify([...wrongSet]));}catch(e){} }
function cardId(c){ return c._book+"|"+c._file+"|"+c.번호; }
async function init(){
  try{ manifest = await (await fetch("manifest.json?"+Date.now())).json(); }
  catch(e){ document.getElementById("setup").innerHTML='<div class="empty-msg">manifest.json을 불러오지 못했습니다.<br>GitHub Pages 또는 로컬 서버에서 열어주세요.</div>'; return; }
  renderBooks(); await loadAllCounts(); renderUnits(); bindChips();
}
function renderBooks(){
  const box=document.getElementById("bookChips"); box.innerHTML="";
  manifest.books.forEach((b,i)=>{
    const el=document.createElement("span");
    el.className="chip book"+(i===0?" on":"");
    el.textContent=b.name; el.dataset.book=b.id;
    el.onclick=()=>{ el.classList.toggle("on"); renderUnits(); };
    box.appendChild(el);
  });
}
async function loadUnit(file){
  if(unitCache[file]) return unitCache[file];
  const d = await (await fetch(file+"?"+Date.now())).json();
  unitCache[file]=d; return d;
}
async function loadAllCounts(){
  for(const b of manifest.books){ for(const u of b.units){
    try{ const d=await loadUnit(u.file); u._count=(d.cards||[]).length; } catch(e){ u._count=0; }
  } }
}
function activeBooks(){ return [...document.querySelectorAll(".chip.book.on")].map(e=>e.dataset.book); }
function renderUnits(){
  const list=document.getElementById("unitList"); list.innerHTML="";
  const books=activeBooks();
  manifest.books.filter(b=>books.includes(b.id)).forEach(b=>{
    let lastDae=null;
    b.units.forEach((u,i)=>{
      if(u.대단원!==lastDae){
        const g=document.createElement("div"); g.className="grp";
        g.textContent="["+b.name+"] "+u.대단원; list.appendChild(g); lastDae=u.대단원;
      }
      const row=document.createElement("label");
      row.className="uitem"+(u._count?"":" empty");
      row.innerHTML='<input type="checkbox" data-book="'+b.id+'" data-file="'+u.file+'" '+(u._count?"checked":"")+'>'
        +'<span>'+u.소단원+'</span><span class="cnt">'+u._count+'장</span>';
      row.querySelector("input").onchange=updatePool;
      list.appendChild(row);
    });
  });
  updatePool();
}
function selectAll(v){ document.querySelectorAll('#unitList input').forEach(c=>c.checked=v); updatePool(); }
function bindChips(){
  document.querySelectorAll(".chip.type").forEach(c=>c.onclick=()=>{
    document.querySelectorAll(".chip.type").forEach(x=>x.classList.remove("on"));
    c.classList.add("on"); updatePool();
  });
  document.querySelectorAll(".chip.diff").forEach(c=>c.onclick=()=>{ c.classList.toggle("on"); updatePool(); });
}
function selectedType(){ return document.querySelector(".chip.type.on").dataset.type; }
function selectedDiffs(){ return [...document.querySelectorAll(".chip.diff.on")].map(e=>e.dataset.diff); }
async function gatherPool(){
  const checks=[...document.querySelectorAll('#unitList input:checked')];
  const type=selectedType(), diffs=selectedDiffs();
  let cards=[];
  for(const ch of checks){
    const d=await loadUnit(ch.dataset.file);
    (d.cards||[]).forEach(c=>{
      const card=Object.assign({}, c, {_book:ch.dataset.book, _file:ch.dataset.file, _unit:d.소단원});
      if(type!=="전체" && card.유형!==type) return;
      if(diffs.length && !diffs.includes(card.난이도)) return;
      cards.push(card);
    });
  }
  return cards;
}
async function updatePool(){
  const cards=await gatherPool();
  document.getElementById("poolStat").textContent="출제 대상: "+cards.length+"장  (틀린 카드 누적 "+wrongSet.size+"장)";
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;} return a; }
async function start(fromWrong){
  let cards = await gatherPool();
  if(fromWrong){ cards = cards.filter(c=>wrongSet.has(cardId(c))); }
  if(!cards.length){ alert(fromWrong?"틀린 카드가 없습니다.":"선택한 조건에 카드가 없습니다."); return; }
  pool=shuffle(cards); idx=0; session={correct:0,wrong:0};
  document.getElementById("setup").style.display="none";
  document.getElementById("study").style.display="block";
  showCard();
}
function loadWrongOnly(){ selectAll(true); start(true); }
function showCard(){
  if(idx>=pool.length){ return finish(); }
  revealed=false;
  const c=pool[idx];
  document.getElementById("mUnit").textContent=c._unit;
  const t=document.getElementById("mType"); t.textContent=c.유형; t.className="pill "+(c.유형==="OX"?"ox":(c.유형==="단답형"?"da":"sa"));
  const d=document.getElementById("mDiff"); d.textContent=c.난이도; d.className="pill d"+c.난이도;
  document.getElementById("mSrc").innerHTML="";
  document.getElementById("qText").textContent=c.문제;
  const av=document.getElementById("aVal"); av.textContent=c.정답; av.className="val "+c.정답;
  document.getElementById("aExp").textContent=c.해설||"";
  document.getElementById("ansBox").classList.remove("show");
  document.getElementById("gradeBox").classList.add("hide");
  document.getElementById("oxResult").classList.add("hide");
  document.getElementById("nextBtn").classList.add("hide");
  if(c.유형==="OX"){
    document.getElementById("oxBox").classList.remove("hide");
    document.getElementById("revealBtn").classList.add("hide");
  }else{
    document.getElementById("oxBox").classList.add("hide");
    document.getElementById("revealBtn").classList.remove("hide");
  }
  document.getElementById("bar").style.width=(idx/pool.length*100)+"%";
  updateStat();
}
function updateStat(){
  document.getElementById("studyStat").textContent=(idx+1)+" / "+pool.length+"  ·  맞음 "+session.correct+" / 틀림 "+session.wrong;
}
function reveal(){
  revealed=true;
  document.getElementById("ansBox").classList.add("show");
  document.getElementById("revealBtn").classList.add("hide");
  document.getElementById("gradeBox").classList.remove("hide");
}
function answerOX(choice){
  const c=pool[idx];
  document.getElementById("oxBox").classList.add("hide");
  document.getElementById("ansBox").classList.add("show");
  const ok=(choice===c.정답);
  if(ok){ session.correct++; wrongSet.delete(cardId(c)); }
  else{ session.wrong++; wrongSet.add(cardId(c)); }
  saveWrong();
  const res=document.getElementById("oxResult");
  res.classList.remove("hide");
  res.textContent= ok ? "✓ 정답!" : "✕ 오답 (정답: "+c.정답+")";
  res.style.color= ok ? "var(--ok)" : "var(--no)";
  document.getElementById("nextBtn").classList.remove("hide");
  updateStat();
}
function nextCard(){ idx++; showCard(); }
function grade(ok){
  const c=pool[idx];
  if(ok){ session.correct++; wrongSet.delete(cardId(c)); }
  else{ session.wrong++; wrongSet.add(cardId(c)); }
  saveWrong(); idx++; showCard();
}
function finish(){
  document.getElementById("bar").style.width="100%";
  document.querySelector(".flash").innerHTML=
    '<div class="done"><div class="big">'+(session.wrong?"💪":"🎉")+'</div>'
    +'<div style="font-size:18px;font-weight:600;margin-bottom:6px;">학습 완료!</div>'
    +'<div style="color:var(--muted)">맞음 '+session.correct+' · 틀림 '+session.wrong+' (총 '+pool.length+'장)</div></div>';
  document.getElementById("revealBtn").classList.add("hide");
  document.getElementById("gradeBox").classList.add("hide");
  document.getElementById("oxBox").classList.add("hide");
  document.getElementById("nextBtn").classList.add("hide");
  document.getElementById("oxResult").classList.add("hide");
  document.getElementById("studyStat").textContent= session.wrong? "‘틀린 카드만’으로 다시 도전해 보세요.":"";
}
function quit(){
  document.getElementById("study").style.display="none";
  document.querySelector(".flash").innerHTML=
    '<div class="q" id="qText"></div>'
    +'<div class="ans" id="ansBox"><div class="label">정답</div><div class="val" id="aVal"></div>'
    +'<div class="label">해설</div><div class="exp" id="aExp"></div></div>';
  document.getElementById("setup").style.display="block";
  updatePool();
}
function resetWrong(){ if(confirm("틀린 카드 기록을 모두 지울까요?")){ wrongSet.clear(); saveWrong(); updatePool(); } }
function showInstallBar(){
  try{
    const ua=navigator.userAgent||"";
    const isiOS=/iPhone|iPad|iPod/i.test(ua);
    const isAndroid=/Android/i.test(ua);
    const standalone=window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true;
    if(standalone) return;
    if(!isiOS && !isAndroid) return;
    if(localStorage.getItem('install_dismiss_v1')) return;
    const steps=document.getElementById('installSteps');
    if(isiOS) steps.innerHTML='Safari 하단 <b>공유</b> 버튼 → <b>"홈 화면에 추가"</b>';
    else steps.innerHTML='Chrome 메뉴 <b>⋮</b> → <b>"홈 화면에 추가"</b> (또는 "앱 설치")';
    document.getElementById('installBar').style.display='block';
  }catch(e){}
}
function dismissInstall(){ try{localStorage.setItem('install_dismiss_v1','1');}catch(e){} document.getElementById('installBar').style.display='none'; }
if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }
showInstallBar();
init();
</script>
</body>
</html>
