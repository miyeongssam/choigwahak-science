<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<title>최과학 일정</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1f2430; --sub:#7a8494;
  --jikbo:#e0455a; --bogang:#e8842c; --jeonggyu:#2f9e63; --gaegang:#2b6cb0; --hyugang:#9aa3b0; --hakgyo:#7b5cc4;
  --today:#fff7dd; --todayline:#f2b705;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);padding:12px 14px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;display:flex;align-items:center;gap:8px}
header h1 .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#2b6cb0,#5aa3e8);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.viewBtns{display:flex;gap:4px;background:#eef1f5;border-radius:9px;padding:3px}
.viewBtns button{border:none;background:transparent;font-size:12.5px;padding:5px 10px;border-radius:7px;color:var(--sub);white-space:nowrap}
header h1{white-space:nowrap}
@media (max-width:420px){ .viewBtns button{padding:5px 7px;font-size:12px} header h1{font-size:15.5px} }
.viewBtns button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#todayLabel{font-size:12px;color:var(--sub);margin-top:3px}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid #dde2e9;background:#fff;color:var(--sub);user-select:none}
.chip.on{color:#fff;border-color:transparent}
.chip.on[data-f="전체"]{background:#1f2430}
.chip.on[data-f="직보"]{background:var(--jikbo)}
.chip.on[data-f="보강"]{background:var(--bogang)}
.chip.on[data-f="정규"]{background:var(--jeonggyu)}
.chip.on[data-f="개강"]{background:var(--gaegang)}
.chip.on[data-f="휴강"]{background:var(--hyugang)}
.chip.on[data-f="학교"]{background:var(--hakgyo)}
main{padding:12px 12px 0;max-width:560px;margin:0 auto}
/* ---- calendar ---- */
.calNav{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.calNav b{font-size:16px}
.calNav button{border:1px solid #dde2e9;background:#fff;border-radius:9px;font-size:14px;padding:6px 14px;color:var(--ink)}
.calNav button:disabled{opacity:.3}
.calCard{background:var(--card);border-radius:16px;padding:10px 8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.wdRow,.week{display:grid;grid-template-columns:repeat(7,1fr)}
.wdRow div{text-align:center;font-size:11.5px;color:var(--sub);padding:4px 0 8px;font-weight:600}
.wdRow div:first-child{color:#e0455a}
.wdRow div:last-child{color:#2b6cb0}
.cell{min-height:52px;border-radius:10px;padding:4px 2px 3px;text-align:center;position:relative;cursor:pointer}
.cell .n{font-size:13px;font-weight:600;line-height:1.4}
.cell.sun .n{color:#e0455a}
.cell.sat .n{color:#2b6cb0}
.cell.out{visibility:hidden}
.cell.noev .n{color:#c3c9d2;font-weight:400}
.cell.noev.sun .n{color:#eec2c8}.cell.noev.sat .n{color:#c0d4ea}
.cell.today{background:var(--today);box-shadow:inset 0 0 0 1.5px var(--todayline)}
.cell.sel{background:#e9f1fb;box-shadow:inset 0 0 0 1.5px #2b6cb0}
.cell.today.sel{background:var(--today);box-shadow:inset 0 0 0 1.5px var(--todayline),inset 0 0 0 3px #2b6cb055}
.dots{display:flex;justify-content:center;gap:2.5px;flex-wrap:wrap;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.직보{background:var(--jikbo)}.dot.보강{background:var(--bogang)}.dot.정규{background:var(--jeonggyu)}
.dot.개강{background:var(--gaegang)}.dot.휴강{background:var(--hyugang)}.dot.학교{background:var(--hakgyo)}.dot.개인{background:#e05a9c}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 2px;font-size:11px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:4px}
/* detail */
.detail{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.detail h3{font-size:14px;margin-bottom:6px}
.detail h3 .tb{font-size:10px;background:var(--todayline);color:#5c4300;border-radius:6px;padding:1px 6px;font-weight:700;vertical-align:1px;margin-left:5px}
.empty{font-size:13px;color:var(--sub);padding:4px 0}
/* ---- list ---- */
.monthTitle{font-size:15px;font-weight:700;margin:18px 4px 8px;color:#333}
.day{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.day.today{background:var(--today);border:1.5px solid var(--todayline)}
.day.past{opacity:.45}
.dcol{flex:0 0 52px;text-align:center;padding-top:2px}
.dcol .num{font-size:16px;font-weight:700}
.dcol .wd{font-size:11px;color:var(--sub)}
.dcol .wd.sat{color:#2b6cb0}.dcol .wd.sun{color:#e0455a}
.dcol .tbadge{display:inline-block;margin-top:4px;font-size:10px;background:var(--todayline);color:#5c4300;border-radius:6px;padding:1px 6px;font-weight:700}
.evs{flex:1;min-width:0}
.ev{display:flex;align-items:baseline;gap:7px;padding:3px 0;font-size:13.5px}
.ev .time{flex:0 0 44px;font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px}
.ev .tag{flex:0 0 auto;font-size:10.5px;color:#fff;border-radius:5px;padding:1.5px 6px;font-weight:600}
.tag.직보{background:var(--jikbo)}.tag.보강{background:var(--bogang)}.tag.정규{background:var(--jeonggyu)}
.tag.개강{background:var(--gaegang)}.tag.휴강{background:var(--hyugang)}.tag.학교{background:var(--hakgyo)}.tag.개인{background:#e05a9c}
.ev .tt{flex:1;min-width:0}
.ev .memo{display:block;font-size:11.5px;color:var(--sub)}
.ev.dim{opacity:.6}
.note{background:#eef3fa;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.65;color:#3a4656;margin:8px 0}
.note b{color:#2b6cb0}
/* ---- 회차 (수업 횟수 세기) ---- */
.grpT{font-size:11.5px;color:var(--sub);font-weight:600;margin:8px 2px 5px}
.units{display:flex;flex-wrap:wrap;gap:6px}
.unit{font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid #dde2e9;background:#fff;color:var(--ink);user-select:none;cursor:pointer}
.unit.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff;font-weight:600}
.sumCard{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sumCard .slot{font-size:12px;color:var(--sub);margin-bottom:10px}
.nums{display:flex;gap:10px}
.num2{flex:1;background:#f3f6fa;border-radius:12px;padding:10px 12px}
.num2 .lb{font-size:12px;color:var(--sub)}
.num2 .v{font-size:28px;font-weight:800;line-height:1.2}
.num2 .v small{font-size:14px;font-weight:600;margin-left:2px}
.num2 .br{font-size:11.5px;color:var(--sub);margin-top:2px}
.num2.bill{background:#e9f1fb}
.num2.bill .v{color:#2b6cb0}
.pill{display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600;margin:8px 4px 0 0}
.pill.five{background:#fff1d6;color:#8a5a00}
.pill.warn{background:#fde4e7;color:#b0283c}
.pill.ok{background:#e3f4ea;color:#1f7a4a}
.cntList{background:var(--card);border-radius:14px;padding:6px 12px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.crow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:13.5px}
.crow:last-child{border-bottom:none}
.crow .cd{flex:0 0 62px;font-weight:600;font-variant-numeric:tabular-nums}
.crow .cd.sat{color:#2b6cb0}.crow .cd.sun{color:#e0455a}
.crow .ct{flex:0 0 40px;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.crow .tag{flex:0 0 auto;font-size:10.5px;color:#fff;border-radius:5px;padding:1.5px 6px;font-weight:600}
.crow .tx{flex:1;min-width:0;font-size:12.5px;color:#4a5361}
.crow .mk{flex:0 0 auto;font-size:10.5px;border-radius:5px;padding:1px 6px;font-weight:600}
.mk.in{background:#e9f1fb;color:#2b6cb0}.mk.other{background:#eef0f3;color:#7a8494}.mk.plan{background:#fff7dd;color:#8a6a00}
.crow.off{opacity:.5}.crow.off .tx{text-decoration:line-through}
.crow.today{background:var(--today);border-radius:8px}
/* ---- 인턴 근무 (2026-10-27 바꿈: 일정 달력처럼 색 점 + 날짜 누르면 아래에) ---- */
.chip.on[data-i="all"]{background:#1f2430}
.chip.on[data-i="S"]{background:#2a8c8c}
.chip.on[data-i="M"]{background:#c2558a}
.dot.k당직{background:#e0455a}.dot.k데이{background:#2b6cb0}.dot.k근무,.dot.k수련{background:#2f9e63}
.dot.k저녁당직,.dot.k수련저녁당직{background:#e8842c}.dot.k휴가{background:#f2b705}
.tag.k당직{background:#e0455a}.tag.k데이{background:#2b6cb0}.tag.k근무,.tag.k수련{background:#2f9e63}
.tag.k저녁당직,.tag.k수련저녁당직{background:#e8842c}.tag.k휴가{background:#f2b705}.tag.k오프{background:var(--hyugang)}
.dot.k외과당직,.tag.k외과당직{background:#e0455a}.dot.k외래,.tag.k외래{background:#7b5cd6}.dot.k시험,.dot.k면접,.tag.k시험,.tag.k면접{background:#c2185b}
.pp{flex:0 0 auto;font-size:11px;color:#fff;border-radius:5px;padding:1.5px 6px;font-weight:600}
.pp.S{background:#2a8c8c}.pp.M{background:#c2558a}
/* ---- 가족 (2026-11-24 원장: 생일 · 기일 · 원장 약속) ---- */
.dot.f생일,.tag.f생일{background:#e05a9c}.dot.f기일,.tag.f기일{background:#6b6f8a}.dot.f병원,.tag.f병원{background:#e0455a}
.dot.f운동,.tag.f운동{background:#2f9e63}.dot.f약속,.tag.f약속{background:#2b6cb0}.dot.f기타,.tag.f기타{background:#9aa3b0}
.dot.f기념일,.tag.f기념일{background:#a855f7}.dot.f돈,.tag.f돈{background:#0f9d8a}
.ev .who{flex:0 0 auto;font-size:11px;color:var(--sub)}
.acad{margin-top:8px;padding-top:6px;border-top:1px dashed #e3e7ee}
.acad .lb{font-size:11px;color:var(--sub);margin-bottom:2px}
.acad .ev{opacity:.7;font-size:12.5px}
.ifoot{max-width:560px;margin:26px auto 0;font-size:11px;color:var(--sub);line-height:1.7;padding:0 4px}
.foot{max-width:560px;margin:22px auto 0;text-align:center;font-size:11.5px;color:var(--sub);padding:0 12px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><span class="logo">최</span>최과학 일정</h1>
    <div class="viewBtns">
      <button id="btnCal" class="on">달력</button>
      <button id="btnList">목록</button>
      <button id="btnCnt">회차</button>
      <button id="btnInt">인턴</button>
      <button id="btnFam">가족</button>
    </div>
  </div>
  <div id="todayLabel"></div>
  <div class="chips" id="chips">
    <span class="chip on" data-f="전체">전체</span>
    <span class="chip" data-f="직보">직보</span>
    <span class="chip" data-f="보강">보강</span>
    <span class="chip" data-f="정규">정규</span>
    <span class="chip" data-f="개강">개강</span>
    <span class="chip" data-f="휴강">휴강</span>
    <span class="chip" data-f="학교">학교</span>
    <span class="chip" data-f="개인">개인</span>
  </div>
  <div class="chips" id="ichips" style="display:none"></div>
</header>
<main id="main"></main>
<div class="foot">최과학 과학전문학원 · 2026 2학기 중간~기말 · 일정은 학원 공용 표에서 (2026-10-16)</div>
<style>
/* 홈 화면 설치 안내 — 스킬 pwa-install-guide reference/install-guide.css 그대로(색만 일정 앱 파랑) · 결정 D-769 */
:root { --ig-accent: #2b6cb0; --ig-accent-text: #fff; --ig-warn: #c2410c; --ig-surface: #fff; --ig-text: #182222; --ig-note: #fff4d6; --ig-bottom: 0px; }
.ig-bar { position: fixed; left: 50%; bottom: calc(16px + var(--ig-bottom) + env(safe-area-inset-bottom)); z-index: 50; display: flex; align-items: center; gap: 4px; max-width: calc(100% - 24px); padding: 4px 6px 4px 16px; border-radius: 999px; background: var(--ig-accent); color: var(--ig-accent-text); box-shadow: 0 6px 18px rgba(0,0,0,.25); transform: translateX(-50%); }
.ig-bar.ig-warn { background: var(--ig-warn); color: #fff; }
.ig-bar button { border: 0; background: transparent; color: inherit; font: inherit; font-weight: 800; cursor: pointer; }
.ig-go { min-height: 48px; padding: 0 6px; font-size: 16px; white-space: nowrap; }
.ig-x { min-width: 40px; min-height: 40px; border-radius: 50%; opacity: .85; }
.ig-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: rgba(0,0,0,.45); }
.ig-modal { width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; padding: 18px 16px 16px; border-radius: 16px; background: var(--ig-surface); color: var(--ig-text); }
.ig-modal h2 { margin: 0 0 6px; font-size: 18px; }
.ig-steps { margin: 10px 0 12px; padding-left: 22px; line-height: 1.7; }
.ig-note { margin: 10px 0; padding: 10px 12px; border-radius: 12px; background: var(--ig-note); font-size: 14px; }
.ig-small { font-size: 13px; opacity: .75; }
.ig-input { width: 100%; margin: 10px 0 6px; padding: 10px 12px; border: 1px solid rgba(127,127,127,.4); border-radius: 10px; background: transparent; color: inherit; font: inherit; }
.ig-btn { min-height: 44px; padding: 0 14px; border: 1px solid rgba(127,127,127,.4); border-radius: 10px; background: transparent; color: inherit; font: inherit; cursor: pointer; }
.ig-primary { background: var(--ig-accent); border-color: var(--ig-accent); color: var(--ig-accent-text); font-weight: 700; }
.ig-block { display: block; width: 100%; margin-top: 8px; }
.ig-btns { display: flex; gap: 8px; margin-top: 14px; }
.ig-btns .ig-btn { flex: 1; }
body.ig-on { padding-bottom: 96px; }
</style>
<script>
// 잠긴 일정 앱(원장 2026-11-24 · 결정 D-748 · D-769)
// ① 열쇠: 처음 한 번 가족 링크(#k=… 또는 ?k=…)로 받아 이 휴대폰에만 둔다
// ② 카톡 · 슬랙 등 앱 안 화면이면 크롬(아이폰 카톡은 사파리)으로 저절로 넘긴다 — 열쇠를 같이 넘긴다
// ③ 크롬 · 사파리에서는 「📲 홈 화면에 앱으로 설치」 배너 — 스킬 pwa-install-guide 방식(학원 앱 InstallAppButton과 같음)
// ④ 아이폰은 사파리 기억이 설치한 앱으로 안 넘어가서, 열쇠가 있으면 주소에 ?k=를 남겨 「홈 화면에 추가」한 아이콘이 열쇠째 열리게 한다
(function(){
  'use strict';
  const UA = navigator.userAgent;
  const BASE = location.origin + location.pathname;
  const isStandalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const IN_APP = [[/KAKAOTALK/i, '카카오톡'], [/Slack/i, '슬랙'], [/NAVER\(inapp/i, '네이버 앱'], [/Instagram/i, '인스타그램'], [/FBAN|FBAV|FB_IAB/i, '페이스북'], [/\bLine\//i, '라인'], [/BAND\//i, '밴드'], [/DaumApps/i, '다음 앱'], [/Telegram/i, '텔레그램'], [/everytimeApp/i, '에브리타임']];

  // ---- 열쇠 받기 ----
  let key = null;
  const m = (location.hash + '&' + location.search).match(/[#?&]k=([A-Za-z0-9_-]{40,})/);
  try { if (m) localStorage.setItem('schedKey', m[1]); key = localStorage.getItem('schedKey'); } catch (e) { key = m ? m[1] : null; }
  if (!key && m) key = m[1];
  const KEYURL = key ? BASE + '?k=' + key : BASE;

  function state() {
    if (isStandalone()) return { kind: 'app' };
    const ios = isIOS(), android = /Android/i.test(UA);
    if (!ios && !android) return { kind: 'desktop' };
    const hit = IN_APP.find(([re]) => re.test(UA));
    if (hit) return { kind: 'inapp', name: hit[1], ios, android, kakao: /KAKAOTALK/i.test(UA) };
    if (ios) {
      if (/CriOS|FxiOS|EdgiOS|OPiOS|Whale/i.test(UA)) return { kind: 'other', name: '다른 브라우저', ios };
      if (!/Safari\//.test(UA)) return { kind: 'inapp', name: '앱 안 화면', ios };
      return { kind: 'safari', ios };
    }
    if (/; wv\)/.test(UA)) return { kind: 'inapp', name: '앱 안 화면', android };
    const other = UA.match(/SamsungBrowser|EdgA|OPR|Whale|YaBrowser|Firefox|UCBrowser|MiuiBrowser|HuaweiBrowser/i);
    if (other || !/Chrome\//.test(UA)) return { kind: 'other', name: other && /Samsung/i.test(other[0]) ? '삼성 인터넷' : '다른 브라우저', android };
    return { kind: 'chrome', android };
  }
  const st = state();
  const chromeIntent = () => 'intent://' + location.host + location.pathname + (key ? '?k=' + key : '') + '#Intent;scheme=https;package=com.android.chrome;S.browser_fallback_url=' + encodeURIComponent(KEYURL) + ';end';
  const kakaoSafari = () => 'kakaotalk://web/openExternal?url=' + encodeURIComponent(KEYURL);

  // ---- ② 앱 안 화면이면 저절로 크롬 · 사파리로(학원 앱과 같이 열자마자 한 번) ----
  let jumped = false;
  if (st.kind === 'inapp') {
    try { if (st.android) { jumped = true; location.assign(chromeIntent()); } else if (st.ios && st.kakao) { jumped = true; location.assign(kakaoSafari()); } } catch (e) {}
  }

  // ---- 주소 정리: 안드로이드 · 컴퓨터는 열쇠를 주소에서 지운다(크롬과 설치한 앱이 기억을 같이 씀) / 아이폰 사파리는 ?k=를 남기고 manifest를 떼어 홈 화면 아이콘이 열쇠째 열리게 ----
  try {
    if (key && st.kind === 'safari') {
      if (location.search.indexOf('k=') < 0 || location.hash) history.replaceState(null, '', KEYURL);
      const ml = document.querySelector('link[rel="manifest"]'); if (ml) ml.remove();
    } else if (m && st.kind !== 'inapp') {
      history.replaceState(null, '', BASE);
    }
  } catch (e) {}

  // ---- ③ 설치 안내(pwa-install-guide reference/install-guide.js와 같은 흐름) ----
  let deferred = null, closed = false;
  const esc = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  function modal(inner, onMount) {
    const wrap = document.createElement('div'); wrap.className = 'ig-wrap';
    wrap.innerHTML = '<div class="ig-modal" role="dialog" aria-modal="true">' + inner + '</div>';
    document.body.appendChild(wrap);
    wrap.addEventListener('click', e => { if (e.target === wrap || e.target.closest('[data-ig=close]')) wrap.remove(); });
    if (onMount) onMount(wrap);
  }
  const okBtn = '<div class="ig-btns"><button type="button" class="ig-btn ig-primary" data-ig="close">알겠어요</button></div>';
  function androidGuide() { modal('<h2>📲 안드로이드에서 앱으로 설치하기</h2><ol class="ig-steps"><li>크롬 오른쪽 위 <b>⋮</b>(점 세 개)를 누르세요</li><li><b>「앱 설치」</b> 또는 <b>「홈 화면에 추가 → 설치」</b>를 누르세요</li><li>홈 화면에 생긴 <b>최과학 일정</b> 아이콘으로 여세요</li></ol><div class="ig-note">「바로가기 만들기」는 고르지 마세요. 앱이 아니라 크롬 안에서 열리는 바로가기예요.</div>' + okBtn); }
  function iosGuide() { modal('<h2>📲 아이폰에서 앱으로 설치하기</h2><ol class="ig-steps"><li>화면 아래 가운데 <b>공유 버튼(□↑)</b>을 누르세요</li><li>메뉴를 내려 <b>「홈 화면에 추가」</b> → <b>추가</b>를 누르세요</li><li>홈 화면에 생긴 <b>최과학 일정</b> 아이콘으로 여세요</li></ol>' + okBtn); }
  function openInBrowserGuide() {
    const target = st.ios ? '사파리' : '크롬';
    modal('<h2>⚠️ 이 화면에서는 설치가 안 돼요</h2><p>지금 <b>' + esc(st.name || '다른 화면') + '</b>에서 열려 있어요. <b>' + target + '</b>에서 열어야 설치돼요.</p>'
      + (st.android ? '<button type="button" class="ig-btn ig-primary ig-block" data-open="chrome">크롬으로 열기</button>' : '')
      + (st.ios && st.kakao ? '<button type="button" class="ig-btn ig-primary ig-block" data-open="kakao">사파리로 열기</button>' : '')
      + '<button type="button" class="ig-btn ig-block" data-copy>📋 주소 복사</button><p class="ig-small">버튼이 안 되면: 주소를 복사해서 <b>' + target + ' 주소창</b>에 붙여넣고 여세요. 이 주소는 가족에게만 — 남에게 보내지 마세요.</p><div class="ig-btns"><button type="button" class="ig-btn" data-ig="close">닫기</button></div>', w => {
      w.addEventListener('click', async e => {
        const o = e.target.closest('[data-open]');
        if (o && o.dataset.open === 'chrome') location.href = chromeIntent();
        if (o && o.dataset.open === 'kakao') location.href = kakaoSafari();
        const c = e.target.closest('[data-copy]');
        if (c) { let ok = false; try { await navigator.clipboard.writeText(KEYURL); ok = true; } catch (er) {} c.textContent = ok ? '복사했어요. ' + target + ' 주소창에 붙여넣으세요' : '복사가 안 돼요 — 카톡 링크를 길게 눌러 복사하세요'; }
      });
    });
  }
  async function help() {
    if (st.kind === 'app' || st.kind === 'desktop') return;
    if (st.kind === 'chrome' && deferred) { const ev = deferred; deferred = null; ev.prompt(); try { await ev.userChoice; } catch (e) {} return; }
    if (st.kind === 'chrome') return androidGuide();
    if (st.kind === 'safari') return iosGuide();
    return openInBrowserGuide();
  }
  function updateBar() {
    const show = !['app', 'desktop'].includes(st.kind) && !closed && !jumped;
    document.body.classList.toggle('ig-on', show);
    let bar = document.getElementById('igBar');
    if (!show) { if (bar) bar.remove(); return; }
    if (!bar) {
      bar = document.createElement('div'); bar.id = 'igBar'; bar.className = 'ig-bar'; bar.setAttribute('role', 'region'); bar.setAttribute('aria-label', '앱 설치 안내');
      bar.addEventListener('click', e => { if (e.target.closest('[data-ig=x]')) { closed = true; updateBar(); } else if (e.target.closest('[data-ig=go]')) help(); });
      document.body.appendChild(bar);
    }
    const ok = st.kind === 'chrome' || st.kind === 'safari';
    bar.classList.toggle('ig-warn', !ok);
    bar.innerHTML = '<button type="button" class="ig-go" data-ig="go">' + (ok ? '📲 홈 화면에 앱으로 설치' : '⚠️ ' + (st.ios ? '사파리' : '크롬') + '에서 열어야 설치돼요') + '</button><button type="button" class="ig-x" data-ig="x" aria-label="이번에만 닫기">✕</button>';
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); if (st.kind === 'chrome') deferred = e; });
  window.addEventListener('appinstalled', () => { deferred = null; closed = true; updateBar(); });
  if (document.body) updateBar(); else document.addEventListener('DOMContentLoaded', updateBar);
  // 앱 안 화면으로 넘어가지 못했을 때(아이폰 슬랙 등) 1.5초 뒤 배너를 보인다
  if (jumped) setTimeout(() => { jumped = false; updateBar(); }, 1500);
  window.InstallGuide = { state: () => st, help: help };
  window.__schedKey = key;
})();
</script>
