<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b6cb0">
<title>최과학 일정</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f7f9; --card:#fff; --ink:#1f2430; --sub:#7a8494;
  --jikbo:#e0455a; --bogang:#e8842c; --jeonggyu:#2f9e63; --gaegang:#2b6cb0; --hyugang:#9aa3b0; --hakgyo:#7b5cc4;
  --today:#fff7dd; --todayline:#f2b705;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--ink);padding-bottom:40px}
header{position:sticky;top:0;z-index:10;background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.08);padding:12px 14px 10px}
.hrow{display:flex;align-items:center;justify-content:space-between}
header h1{font-size:17px;display:flex;align-items:center;gap:8px}
header h1 .logo{width:24px;height:24px;border-radius:6px;background:linear-gradient(135deg,#2b6cb0,#5aa3e8);color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.viewBtns{display:flex;gap:4px;background:#eef1f5;border-radius:9px;padding:3px}
.viewBtns button{border:none;background:transparent;font-size:12.5px;padding:5px 12px;border-radius:7px;color:var(--sub)}
.viewBtns button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1)}
#todayLabel{font-size:12px;color:var(--sub);margin-top:3px}
.chips{display:flex;gap:6px;margin-top:9px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;font-size:12px;padding:5px 11px;border-radius:999px;border:1px solid #dde2e9;background:#fff;color:var(--sub);user-select:none}
.chip.on{color:#fff;border-color:transparent}
.chip.on[data-f="전체"]{background:#1f2430}
.chip.on[data-f="직보"]{background:var(--jikbo)}
.chip.on[data-f="보강"]{background:var(--bogang)}
.chip.on[data-f="정규"]{background:var(--jeonggyu)}
.chip.on[data-f="개강"]{background:var(--gaegang)}
.chip.on[data-f="휴강"]{background:var(--hyugang)}
.chip.on[data-f="학교"]{background:var(--hakgyo)}
main{padding:12px 12px 0;max-width:560px;margin:0 auto}
/* ---- calendar ---- */
.calNav{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 10px}
.calNav b{font-size:16px}
.calNav button{border:1px solid #dde2e9;background:#fff;border-radius:9px;font-size:14px;padding:6px 14px;color:var(--ink)}
.calNav button:disabled{opacity:.3}
.calCard{background:var(--card);border-radius:16px;padding:10px 8px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.wdRow,.week{display:grid;grid-template-columns:repeat(7,1fr)}
.wdRow div{text-align:center;font-size:11.5px;color:var(--sub);padding:4px 0 8px;font-weight:600}
.wdRow div:first-child{color:#e0455a}
.wdRow div:last-child{color:#2b6cb0}
.cell{min-height:52px;border-radius:10px;padding:4px 2px 3px;text-align:center;position:relative;cursor:pointer}
.cell .n{font-size:13px;font-weight:600;line-height:1.4}
.cell.sun .n{color:#e0455a}
.cell.sat .n{color:#2b6cb0}
.cell.out{visibility:hidden}
.cell.noev .n{color:#c3c9d2;font-weight:400}
.cell.noev.sun .n{color:#eec2c8}.cell.noev.sat .n{color:#c0d4ea}
.cell.today{background:var(--today);box-shadow:inset 0 0 0 1.5px var(--todayline)}
.cell.sel{background:#e9f1fb;box-shadow:inset 0 0 0 1.5px #2b6cb0}
.cell.today.sel{background:var(--today);box-shadow:inset 0 0 0 1.5px var(--todayline),inset 0 0 0 3px #2b6cb055}
.dots{display:flex;justify-content:center;gap:2.5px;flex-wrap:wrap;margin-top:2px}
.dot{width:6px;height:6px;border-radius:50%}
.dot.직보{background:var(--jikbo)}.dot.보강{background:var(--bogang)}.dot.정규{background:var(--jeonggyu)}
.dot.개강{background:var(--gaegang)}.dot.휴강{background:var(--hyugang)}.dot.학교{background:var(--hakgyo)}
.legend{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0 2px;font-size:11px;color:var(--sub)}
.legend span{display:flex;align-items:center;gap:4px}
/* detail */
.detail{background:var(--card);border-radius:14px;padding:12px 14px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.detail h3{font-size:14px;margin-bottom:6px}
.detail h3 .tb{font-size:10px;background:var(--todayline);color:#5c4300;border-radius:6px;padding:1px 6px;font-weight:700;vertical-align:1px;margin-left:5px}
.empty{font-size:13px;color:var(--sub);padding:4px 0}
/* ---- list ---- */
.monthTitle{font-size:15px;font-weight:700;margin:18px 4px 8px;color:#333}
.day{background:var(--card);border-radius:14px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.day.today{background:var(--today);border:1.5px solid var(--todayline)}
.day.past{opacity:.45}
.dcol{flex:0 0 52px;text-align:center;padding-top:2px}
.dcol .num{font-size:16px;font-weight:700}
.dcol .wd{font-size:11px;color:var(--sub)}
.dcol .wd.sat{color:#2b6cb0}.dcol .wd.sun{color:#e0455a}
.dcol .tbadge{display:inline-block;margin-top:4px;font-size:10px;background:var(--todayline);color:#5c4300;border-radius:6px;padding:1px 6px;font-weight:700}
.evs{flex:1;min-width:0}
.ev{display:flex;align-items:baseline;gap:7px;padding:3px 0;font-size:13.5px}
.ev .time{flex:0 0 44px;font-variant-numeric:tabular-nums;color:var(--sub);font-size:12.5px}
.ev .tag{flex:0 0 auto;font-size:10.5px;color:#fff;border-radius:5px;padding:1.5px 6px;font-weight:600}
.tag.직보{background:var(--jikbo)}.tag.보강{background:var(--bogang)}.tag.정규{background:var(--jeonggyu)}
.tag.개강{background:var(--gaegang)}.tag.휴강{background:var(--hyugang)}.tag.학교{background:var(--hakgyo)}
.ev .tt{flex:1;min-width:0}
.ev .memo{display:block;font-size:11.5px;color:var(--sub)}
.ev.dim{opacity:.6}
.note{background:#eef3fa;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.65;color:#3a4656;margin:8px 0}
.note b{color:#2b6cb0}
/* ---- 회차 (수업 횟수 세기) ---- */
.grpT{font-size:11.5px;color:var(--sub);font-weight:600;margin:8px 2px 5px}
.units{display:flex;flex-wrap:wrap;gap:6px}
.unit{font-size:13px;padding:7px 12px;border-radius:10px;border:1px solid #dde2e9;background:#fff;color:var(--ink);user-select:none;cursor:pointer}
.unit.on{background:#2b6cb0;border-color:#2b6cb0;color:#fff;font-weight:600}
.sumCard{background:var(--card);border-radius:16px;padding:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.sumCard .slot{font-size:12px;color:var(--sub);margin-bottom:10px}
.nums{display:flex;gap:10px}
.num2{flex:1;background:#f3f6fa;border-radius:12px;padding:10px 12px}
.num2 .lb{font-size:12px;color:var(--sub)}
.num2 .v{font-size:28px;font-weight:800;line-height:1.2}
.num2 .v small{font-size:14px;font-weight:600;margin-left:2px}
.num2 .br{font-size:11.5px;color:var(--sub);margin-top:2px}
.num2.bill{background:#e9f1fb}
.num2.bill .v{color:#2b6cb0}
.pill{display:inline-block;font-size:11px;border-radius:6px;padding:2px 7px;font-weight:600;margin:8px 4px 0 0}
.pill.five{background:#fff1d6;color:#8a5a00}
.pill.warn{background:#fde4e7;color:#b0283c}
.pill.ok{background:#e3f4ea;color:#1f7a4a}
.cntList{background:var(--card);border-radius:14px;padding:6px 12px;margin-top:10px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
.crow{display:flex;align-items:baseline;gap:8px;padding:8px 0;border-bottom:1px solid #f0f2f5;font-size:13.5px}
.crow:last-child{border-bottom:none}
.crow .cd{flex:0 0 62px;font-weight:600;font-variant-numeric:tabular-nums}
.crow .cd.sat{color:#2b6cb0}.crow .cd.sun{color:#e0455a}
.crow .ct{flex:0 0 40px;color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.crow .tag{flex:0 0 auto;font-size:10.5px;color:#fff;border-radius:5px;padding:1.5px 6px;font-weight:600}
.crow .tx{flex:1;min-width:0;font-size:12.5px;color:#4a5361}
.crow .mk{flex:0 0 auto;font-size:10.5px;border-radius:5px;padding:1px 6px;font-weight:600}
.mk.in{background:#e9f1fb;color:#2b6cb0}.mk.other{background:#eef0f3;color:#7a8494}.mk.plan{background:#fff7dd;color:#8a6a00}
.crow.off{opacity:.5}.crow.off .tx{text-decoration:line-through}
.crow.today{background:var(--today);border-radius:8px}
.foot{max-width:560px;margin:22px auto 0;text-align:center;font-size:11.5px;color:var(--sub);padding:0 12px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1><span class="logo">최</span>최과학 일정</h1>

</header>
<main id="main"></main>

const EVENTS = COUNT_DATA.cal || [];

const WD = ["일","월","화","수","목","금","토"];
function ymd(dt){return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");}
const todayStr = ymd(new Date());

let filter = "전체";
let mode = "cal";
let curMonth = MONTHS.includes(todayStr.slice(0,7)) ? todayStr.slice(0,7) : "2026-10";
let selDate = todayStr;

function matches(e){ return filter==="전체" || e.type===filter; }
function evsOf(d){ return EVENTS.filter(e=>e.d===d && matches(e)).sort((a,b)=>(a.t||"99").localeCompare(b.t||"99")); }

function evRow(e){
  return '<div class="ev'+(e.type==="휴강"?" dim":"")+'"><span class="time">'+(e.t||"—")+'</span><span class="tag '+e.type+'">'+e.type+'</span><span class="tt">'+e.tt+(e.memo?'<span class="memo">'+e.memo+"</span>":"")+"</span></div>";
}

function renderCal(){
  const main = document.getElementById("main");
  const [y,m] = curMonth.split("-").map(Number);
  const first = new Date(y, m-1, 1);
  const daysIn = new Date(y, m, 0).getDate();
  const idx = MONTHS.indexOf(curMonth);
  let html = '<div class="calNav"><button id="prevM" '+(idx<=0?"disabled":"")+'>&#8249;</button><b>'+y+'년 '+m+'월</b><button id="nextM" '+(idx>=MONTHS.length-1?"disabled":"")+'>&#8250;</button></div>';
  if(MONTH_NOTES[curMonth]) html += '<div class="note">'+MONTH_NOTES[curMonth]+"</div>";
  html += '<div class="calCard"><div class="wdRow">'+WD.map(w=>"<div>"+w+"</div>").join("")+'</div>';
  let cells = "";
  for(let i=0;i<first.getDay();i++) cells += '<div class="cell out"></div>';
  for(let d=1;d<=daysIn;d++){
    const ds = curMonth+"-"+String(d).padStart(2,"0");
    const dow = (first.getDay()+d-1)%7;
    const evs = evsOf(ds);
    const types = [...new Set(evs.map(e=>e.type))];
    let cls = "cell";
    if(dow===0) cls+=" sun"; if(dow===6) cls+=" sat";
    if(!evs.length) cls+=" noev";
    if(ds===todayStr) cls+=" today";
    if(ds===selDate) cls+=" sel";
    cells += '<div class="'+cls+'" data-d="'+ds+'"><div class="n">'+d+'</div><div class="dots">'+types.slice(0,4).map(t=>'<span class="dot '+t+'"></span>').join("")+"</div></div>";
  }
  html += '<div class="week">'+cells+'</div></div>';
  html += '<div class="legend"><span><span class="dot 직보"></span>직보</span><span><span class="dot 보강"></span>보강</span><span><span class="dot 정규"></span>정규</span><span><span class="dot 개강"></span>개강</span><span><span class="dot 휴강"></span>휴강</span><span><span class="dot 학교"></span>학교</span></div>';
  // detail panel
  if(selDate && selDate.slice(0,7)===curMonth){
    const dt = new Date(selDate+"T00:00:00");
    const evs = evsOf(selDate);
    html += '<div class="detail"><h3>'+(dt.getMonth()+1)+"/"+dt.getDate()+" ("+WD[dt.getDay()]+")"+(selDate===todayStr?'<span class="tb">오늘</span>':"")+"</h3>";
    html += evs.length ? evs.map(evRow).join("") : '<div class="empty">'+(dt.getDay()===2?"화요일 학원 휴무":"등록된 일정이 없습니다")+"</div>";
    html += "</div>";
  }
  main.innerHTML = html;
  document.querySelectorAll(".cell[data-d]").forEach(c=>c.onclick=()=>{ selDate=c.dataset.d; renderCal(); });
  const pv=document.getElementById("prevM"), nx=document.getElementById("nextM");
  if(pv) pv.onclick=()=>{ curMonth=MONTHS[idx-1]; selDate=""; renderCal(); };
  if(nx) nx.onclick=()=>{ curMonth=MONTHS[idx+1]; selDate=""; renderCal(); };
}

function renderList(){
  const main = document.getElementById("main");
  main.innerHTML = "";
  const byDate = {};
  EVENTS.forEach(e=>{ if(!matches(e)) return; (byDate[e.d]=byDate[e.d]||[]).push(e); });
  const dates = Object.keys(byDate).sort();
  let cur = "";
  dates.forEach(d=>{
    const isNov = false;
    const label = (d.slice(0,4)!=="2026"?d.slice(0,4)+"년 ":"")+d.slice(5,7).replace(/^0/,"")+"월 일정";
    if(label!==cur){
      cur = label;
      const h=document.createElement("div"); h.className="monthTitle"; h.textContent="📌 "+label; main.appendChild(h);
      if(isNov){ const n=document.createElement("div"); n.className="note"; n.innerHTML=MONTH_NOTES["2026-11"]; main.appendChild(n); }
    }
    const dt = new Date(d+"T00:00:00");
    const row = document.createElement("div");
    row.className = "day"+(d===todayStr?" today":"")+(d<todayStr?" past":"");
    if(d===todayStr) row.id="todayRow";
    const wdCls = dt.getDay()===0?"sun":(dt.getDay()===6?"sat":"");
    row.innerHTML = '<div class="dcol"><div class="num">'+(dt.getMonth()+1)+"/"+dt.getDate()+'</div><div class="wd '+wdCls+'">'+WD[dt.getDay()]+"요일</div>"+(d===todayStr?'<div class="tbadge">오늘</div>':"")+'</div><div class="evs">'+byDate[d].sort((a,b)=>(a.t||"99").localeCompare(b.t||"99")).map(evRow).join("")+"</div>";
    main.appendChild(row);
  });
  const tr=document.getElementById("todayRow");
  if(tr) setTimeout(()=>tr.scrollIntoView({behavior:"smooth",block:"center"}),150);
}

// ---- 회차: 반 · 달을 고르면 수업 날짜 · 실제 수업 횟수 · 청구 회차 ----
const CU = COUNT_DATA.units;
const CMONTHS = [...new Set(CU.flatMap(u=>u.s.map(s=>s.d.slice(0,7))))].sort();
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
let cUnit = lsGet("cntUnit"); if(!CU.some(u=>u.id===cUnit)) cUnit = CU.length ? CU[0].id : "";
let cMonth = CMONTHS.includes(todayStr.slice(0,7)) ? todayStr.slice(0,7) : (CMONTHS[0]||"");
function mLabel(m){ const [y,mm]=m.split("-").map(Number); return (y!==2026?y+"년 ":"")+mm+"월"; }
function md(d){ return Number(d.slice(5,7))+"/"+Number(d.slice(8,10)); }
function grpOf(u){ return u.name.startsWith("예비고1") ? "예비고1" : (u.name.includes("1 ") ? "고1" : "고2"); }

function renderCnt(){
  const main = document.getElementById("main");
  if(!CU.length){ main.innerHTML='<div class="note">회차 데이터가 아직 없습니다.</div>'; return; }
  const u = CU.find(x=>x.id===cUnit);
  let html = "";
  ["고1","고2","예비고1"].forEach(g=>{
    const us = CU.filter(x=>grpOf(x)===g); if(!us.length) return;
    html += '<div class="grpT">'+g+'</div><div class="units">'+us.map(x=>'<span class="unit'+(x.id===cUnit?" on":"")+'" data-u="'+x.id+'">'+x.name+"</span>").join("")+"</div>";
  });
  const idx = CMONTHS.indexOf(cMonth);
  html += '<div class="calNav" style="margin-top:14px"><button id="prevC" '+(idx<=0?"disabled":"")+'>&#8249;</button><b>'+mLabel(cMonth)+'</b><button id="nextC" '+(idx>=CMONTHS.length-1?"disabled":"")+'>&#8250;</button></div>';

  const bill = u.bill.find(b=>b.m===cMonth);
  const rows = u.s.filter(s=> bill ? (s.b===cMonth || (s.d.slice(0,7)===cMonth)) : s.d.slice(0,7)===cMonth);
  const counted = bill ? rows.filter(s=>s.b===cMonth) : rows;
  const real = counted.filter(s=>s.k!=="휴강");
  const by = {}; real.forEach(s=>{ by[s.k]=(by[s.k]||0)+1; });
  const br = ["정규","개강","보강","직보"].filter(k=>by[k]).map(k=>k+" "+by[k]).join(" · ") || "수업 없음";
  html += '<div class="sumCard"><div class="slot">'+u.name+" · "+u.slot+(bill?" · 청구 기간 <b>"+md(bill.fr)+"~"+md(bill.to)+"</b>":"")+"</div>";
  html += '<div class="nums"><div class="num2"><div class="lb">실제 수업</div><div class="v">'+real.length+"<small>회</small></div><div class=\"br\">"+br+"</div></div>";
  if(bill){
    html += '<div class="num2 bill"><div class="lb">청구 회차</div><div class="v">'+bill.cnt+'<small>회</small></div><div class="br">정규 · 개강 · 직보 (보강은 받지 않음)</div></div></div>';
    if(bill.cnt===5) html += '<span class="pill five">5회인 달 — 요금표 G-014</span>';
    if(bill.ex) html += '<span class="pill five">원장 예상: '+bill.ex+" — 직보 날짜는 기말 시험 일정이 나온 뒤</span>";
    if(bill.rc) html += Number(bill.rc)===bill.cnt ? '<span class="pill ok">원장 기록과 같음 ('+bill.ref+")</span>" : '<span class="pill warn">원장 기록 '+bill.rc+"회와 다름 ("+bill.ref+")</span>";
  } else {
    html += '<div class="num2 bill"><div class="lb">청구 회차</div><div class="v" style="font-size:15px;padding-top:8px">아직 정하지 않음</div><div class="br">청구 기간이 표에 없어 달력(1일~말일)으로 셈</div></div></div>';
  }
  if(!u.bill.length && u.tot){
    const all = u.s.filter(s=>s.k!=="휴강").length;
    if(String(all)!==String(u.tot)) html += '<div class="br" style="font-size:11.5px;color:var(--sub);margin-top:8px">반시간표 총 '+u.tot+"차시 · 앱이 만든 매주 날짜 "+all+"개 — 쉬는 날(연휴 등)이 일정 표에 아직 없습니다.</div>";
  }
  html += "</div>";

  html += '<div class="cntList">';
  if(!rows.length) html += '<div class="empty" style="padding:10px 0">이 달에는 수업이 없습니다</div>';
  rows.forEach(s=>{
    const dt = new Date(s.d+"T00:00:00"), dw = dt.getDay();
    const off = s.k==="휴강";
    let mk = "";
    if(bill && s.b && s.b!==cMonth) mk = '<span class="mk other">'+mLabel(s.b)+"분</span>";
    else if(bill && !s.b) mk = '<span class="mk other">청구 기간 밖</span>';
    else if(bill && s.c) mk = '<span class="mk in">청구</span>';
    if(s.d>todayStr && !off) mk += ' <span class="mk plan">예정</span>';
    html += '<div class="crow'+(off?" off":"")+(s.d===todayStr?" today":"")+'"><span class="cd '+(dw===0?"sun":dw===6?"sat":"")+'">'+md(s.d)+"("+WD[dw]+')</span><span class="ct">'+(s.t||"—")+'</span><span class="tag '+s.k+'">'+s.k+'</span><span class="tx">'+(s.e?s.tt:"매주 수업")+"</span>"+mk+"</div>";
  });
  html += "</div>";
  if(!bill && u.bill.length) html += '<div class="note">'+mLabel(cMonth)+" 청구 기간은 아직 표에 없습니다(기말 직보일이 정해진 뒤 정함). 날짜는 매주 수업으로 만든 예상입니다.</div>";
  html += '<div class="foot" style="margin-top:10px">공용 표(반시간표 · 일정 · 청구구획)에서 뽑음 · '+COUNT_DATA.made+"</div>";
  main.innerHTML = html;
  document.querySelectorAll(".unit[data-u]").forEach(c=>c.onclick=()=>{ cUnit=c.dataset.u; lsSet("cntUnit",cUnit); renderCnt(); });
  const pv=document.getElementById("prevC"), nx=document.getElementById("nextC");
  if(pv) pv.onclick=()=>{ cMonth=CMONTHS[idx-1]; renderCnt(); };
  if(nx) nx.onclick=()=>{ cMonth=CMONTHS[idx+1]; renderCnt(); };
}

function render(){
  document.getElementById("chips").style.display = mode==="cnt" ? "none" : "";
  mode==="cal" ? renderCal() : mode==="list" ? renderList() : renderCnt();
}

document.getElementById("chips").addEventListener("click",ev=>{
  const c = ev.target.closest(".chip"); if(!c) return;
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));
  render();
});
document.getElementById("btnCal").onclick=()=>{ mode="cal"; setBtns(); render(); };
document.getElementById("btnList").onclick=()=>{ mode="list"; setBtns(); render(); };
document.getElementById("btnCnt").onclick=()=>{ mode="cnt"; setBtns(); render(); };
function setBtns(){
  document.getElementById("btnCal").classList.toggle("on",mode==="cal");
  document.getElementById("btnList").classList.toggle("on",mode==="list");
  document.getElementById("btnCnt").classList.toggle("on",mode==="cnt");
}

const now = new Date();
document.getElementById("todayLabel").textContent = "오늘 "+(now.getMonth()+1)+"월 "+now.getDate()+"일 ("+WD[now.getDay()]+") · 화요일 학원 휴무";

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
