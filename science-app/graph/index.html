<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>측정값 → 그래프 · 최과학 과학</title>
<link rel="stylesheet" href="../common/common.css">
<style>
.lay{display:grid;grid-template-columns:1fr;gap:12px}
.lay>*{min-width:0}
.fit{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
.fit .it{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center}
.fit .it .k{font-size:13px;color:var(--muted)}
.fit .it .v{font-size:17px;white-space:nowrap;font-weight:700;color:#fde68a;font-variant-numeric:tabular-nums;word-break:break-all}
.eq{font-size:17px;margin-top:10px;text-align:center;font-weight:600}
.ana{margin-top:10px;font-size:15px;line-height:1.7}
.ana b{color:#fde68a}
label.f{display:block;font-size:13px;color:var(--muted);margin:8px 0 4px}
input.t,select.t{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:9px;
  padding:9px 10px;font-size:16px;font-family:inherit}
select.t{appearance:auto}
.ax{display:grid;grid-template-columns:1fr 110px;gap:6px}
table.data{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
table.data th{font-size:13px;color:var(--muted);font-weight:500;padding:4px;text-align:left}
table.data td{padding:3px}
table.data td.n{width:26px;color:var(--muted);font-size:13px;text-align:center}
table.data td.d{width:40px}
table.data input{width:100%;background:var(--card2);color:var(--text);border:1px solid var(--line);border-radius:8px;
  padding:9px 8px;font-size:16px;font-family:inherit;min-width:0}
table.data input:focus,input.t:focus{outline:2px solid var(--accent);border-color:transparent}
table.data .tv{font-size:12px;color:var(--muted);padding:0 4px 4px;text-align:left}
.del{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;width:36px;height:38px;font-size:16px;cursor:pointer}
.warn{color:#fca5a5;font-size:14px;margin-top:6px}
#pngBox img{max-width:100%;border-radius:10px;border:1px solid var(--line);margin-top:8px}
@media (min-width:1000px){
  .wrap{max-width:1680px}
  .lay{grid-template-columns:minmax(0,1fr) 440px;align-items:start}
  .eq{font-size:20px}
  .fit .it .v{font-size:22px}
}
</style>
</head>
<body>
<header class="top"><a class="back" href="../">‹ 홈</a><h1>측정값 → 그래프 · 기울기<small>실험 도구 · 측정값 입력, 최소제곱 추세선과 기울기</small></h1></header>
<div class="wrap">
  <div class="lay">
    <div>
      <canvas id="cv"></canvas>
      <div class="eq" id="eq"></div>
      <div class="fit">
        <div class="it"><div class="k">기울기 a</div><div class="v" id="va">–</div></div>
        <div class="it"><div class="k">y절편 b</div><div class="v" id="vb">–</div></div>
        <div class="it"><div class="k">결정계수 R²</div><div class="v" id="vr">–</div></div>
      </div>
      <div class="warn" id="warn"></div>
      <div class="panel ana" id="ana" style="margin-top:10px"></div>
      <div class="row" style="margin-top:4px">
        <button class="btn" id="bPng">🖼 그래프 PNG로 저장</button>
      </div>
      <div id="pngBox"></div>
    </div>

    <div>
      <div class="panel">
        <h2>예시 데이터 불러오기</h2>
        <div class="grid2">
          <button class="btn ghost" id="exShm">단진동:<br>질량–주기²</button>
          <button class="btn ghost" id="exOhm">옴의 법칙:<br>전압–전류</button>
        </div>
      </div>
      <div class="panel">
        <h2>축 이름 (단위)</h2>
        <label class="f">가로축 x</label>
        <div class="ax"><input class="t" id="lx" placeholder="예: 질량 m (kg)">
          <select class="t" id="tx"><option value="id">x 그대로</option><option value="sq">x²</option><option value="sqrt">√x</option><option value="inv">1/x</option></select></div>
        <label class="f">세로축 y</label>
        <div class="ax"><input class="t" id="ly" placeholder="예: 주기² T² (s²)">
          <select class="t" id="ty"><option value="id">y 그대로</option><option value="sq">y²</option><option value="sqrt">√y</option><option value="inv">1/y</option></select></div>
        <label class="f">추세선</label>
        <div class="row">
          <button class="chip" data-fit="lin">y = ax + b</button>
          <button class="chip" data-fit="org">원점 지나는 직선 y = ax</button>
        </div>
        <label class="f">기울기로 계산하기</label>
        <select class="t" id="anaSel">
          <option value="none">없음</option>
          <option value="shm">단진동: k = 4π²/기울기 (x = m, y = T²)</option>
          <option value="ohm">옴의 법칙: R = 1/기울기 (x = V, y = I)</option>
        </select>
      </div>
      <div class="panel">
        <h2>측정값</h2>
        <table class="data">
          <thead><tr><th></th><th id="hx">x 입력값</th><th id="hy">y 입력값</th><th></th></tr></thead>
          <tbody id="tb"></tbody>
        </table>
        <div class="row" style="margin-top:8px">
          <button class="btn sm" id="bAdd">＋ 행 추가</button>
          <button class="btn ghost sm" id="bClr">지우기</button>
        </div>
        <div class="note" style="margin-top:8px">입력값은 이 기기에 자동 저장돼요. 다시 열어도 그대로 있어요.</div>
      </div>
    </div>
  </div>
</div>
<script src="../common/common.js"></script>
<script>
"use strict";
/*FIT-START*/
// 최소제곱 직선: mode "lin" → y = ax + b, "org" → y = ax (원점 통과)
// R²: lin = 1 − SS잔차/Σ(y−ȳ)², org = 1 − SS잔차/Σy² (엑셀 '절편 0' 추세선과 같은 방식)
function lsq(X, Y, mode){
  const n = X.length;
  if(n < 2) return null;
  let a, b;
  if(mode === "org"){
    let sxy = 0, sxx = 0;
    for(let i = 0; i < n; i++){ sxy += X[i] * Y[i]; sxx += X[i] * X[i]; }
    if(sxx === 0) return null;
    a = sxy / sxx; b = 0;
  } else {
    const mx = X.reduce((s, v) => s + v, 0) / n, my = Y.reduce((s, v) => s + v, 0) / n;
    let sxy = 0, sxx = 0;
    for(let i = 0; i < n; i++){ sxy += (X[i] - mx) * (Y[i] - my); sxx += (X[i] - mx) * (X[i] - mx); }
    if(sxx === 0) return null;
    a = sxy / sxx; b = my - a * mx;
  }
  const my = Y.reduce((s, v) => s + v, 0) / n;
  let ssr = 0, sst = 0;
  for(let i = 0; i < n; i++){ const e = Y[i] - (a * X[i] + b); ssr += e * e; sst += mode === "org" ? Y[i] * Y[i] : (Y[i] - my) * (Y[i] - my); }
  const r2 = sst === 0 ? NaN : 1 - ssr / sst;
  return { a, b, r2, n };
}
// 유효숫자 3자리 표시
function sig3(x){
  if(x === 0) return "0";
  if(!isFinite(x)) return "–";
  x = Number(x.toPrecision(3));
  const ax = Math.abs(x);
  if(ax >= 1000 && ax < 1e5) return String(Number(x.toPrecision(3)));
  if(ax >= 1e-3 && ax < 1000) return x.toPrecision(3);
  const [m, e] = x.toExponential(2).split("e");
  const sup = String(+e).replace(/-/g, "⁻").replace(/\d/g, d => "⁰¹²³⁴⁵⁶⁷⁸⁹"[d]);
  return m + "×10" + sup;
}
/*FIT-END*/

(function(){
const $ = id => document.getElementById(id);
const cv = $("cv"), ctx = cv.getContext("2d");
const KEY = "graph_v1";
const BLANK = () => ({ lx: "", ly: "", tx: "id", ty: "id", fit: "lin", ana: "none", rows: [["", ""], ["", ""], ["", ""], ["", ""], ["", ""]] });
let S = Object.assign(BLANK(), CS.store.get(KEY, {}));
if(!Array.isArray(S.rows) || !S.rows.length) S.rows = BLANK().rows;
const save = () => CS.store.set(KEY, S);

const TR = {
  id: { f: v => v, ok: () => true, x: "x", y: "y" },
  sq: { f: v => v * v, ok: () => true, x: "x²", y: "y²" },
  sqrt: { f: v => Math.sqrt(v), ok: v => v >= 0, x: "√x", y: "√y" },
  inv: { f: v => 1 / v, ok: v => v !== 0, x: "1/x", y: "1/y" }
};
const num = s => { s = String(s).trim().replace(/,/g, "."); if(s === "" || s === "-" || s === ".") return NaN; const v = Number(s); return isFinite(v) ? v : NaN; };

function points(){
  const P = [], bad = [];
  S.rows.forEach((r, i) => {
    const x = num(r[0]), y = num(r[1]);
    if(isNaN(x) || isNaN(y)){ if(String(r[0]).trim() !== "" || String(r[1]).trim() !== "") bad.push(i + 1); return; }
    if(!TR[S.tx].ok(x) || !TR[S.ty].ok(y)){ bad.push(i + 1); return; }
    P.push({ x: TR[S.tx].f(x), y: TR[S.ty].f(y), i });
  });
  return { P, bad };
}

let W = 0, H = 0, dpr = 1;
function resize(){
  dpr = window.devicePixelRatio || 1;
  W = cv.clientWidth;
  H = innerWidth >= 1000 ? Math.round(Math.min(W * 0.66, innerHeight - 230)) : Math.round(Math.min(W * 0.85, innerHeight * 0.6));
  H = Math.max(H, 280);
  cv.style.height = H + "px";
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  draw();
}
function niceStep(range, n){
  const raw = range / n, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw / p;
  return (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p;
}
function range(vals){
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals);
  if(hi - lo === 0){ hi = lo + 1; }
  const st = niceStep(hi - lo, 5);
  lo = Math.floor(lo / st + 1e-9) * st; hi = Math.ceil(hi / st - 1e-9) * st;
  if(hi - Math.max(...vals) < st * 0.05) hi += st;
  if(lo < 0 && Math.min(...vals) - lo < st * 0.05) lo -= st;  // 끝 점이 테두리에 붙지 않게
  return { lo: lo, hi: hi, st };
}
const tick = (v, st) => { const d = Math.max(0, -Math.floor(Math.log10(st) + 1e-9)); return v.toFixed(d); };

let lastFit = null;
function draw(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  // PNG 저장을 위해 배경까지 직접 칠함
  ctx.fillStyle = "#0b1222"; ctx.fillRect(0, 0, W, H);
  const big = W >= 900, fs = big ? 16 : 12;
  const { P } = points(), fit = lastFit = lsq(P.map(p => p.x), P.map(p => p.y), S.fit);
  const mL = big ? 86 : 58, mB = big ? 62 : 48, mT = big ? 54 : 44, mR = big ? 28 : 16;
  const rx = range(P.length ? P.map(p => p.x) : [1]), ry = range(P.length ? P.map(p => p.y) : [1]);
  const X = x => mL + (x - rx.lo) / (rx.hi - rx.lo) * (W - mL - mR);
  const Y = y => H - mB - (y - ry.lo) / (ry.hi - ry.lo) * (H - mT - mB);
  ctx.font = fs + "px sans-serif"; ctx.lineWidth = 1;
  // 격자 + 눈금
  ctx.fillStyle = "#94a3b8";
  for(let v = rx.lo; v <= rx.hi + rx.st * 1e-6; v += rx.st){
    ctx.strokeStyle = Math.abs(v) < rx.st * 1e-6 ? "#64748b" : "#1e293b";
    ctx.beginPath(); ctx.moveTo(X(v), mT); ctx.lineTo(X(v), H - mB); ctx.stroke();
    ctx.textAlign = "center"; ctx.fillText(tick(v, rx.st), X(v), H - mB + fs + 6);
  }
  for(let v = ry.lo; v <= ry.hi + ry.st * 1e-6; v += ry.st){
    ctx.strokeStyle = Math.abs(v) < ry.st * 1e-6 ? "#64748b" : "#1e293b";
    ctx.beginPath(); ctx.moveTo(mL, Y(v)); ctx.lineTo(W - mR, Y(v)); ctx.stroke();
    ctx.textAlign = "right"; ctx.fillText(tick(v, ry.st), mL - 8, Y(v) + fs * 0.35);
  }
  ctx.strokeStyle = "#64748b"; ctx.lineWidth = 1.5; ctx.strokeRect(mL, mT, W - mL - mR, H - mT - mB);
  // 축 이름
  ctx.fillStyle = "#e2e8f0"; ctx.font = "600 " + fs + "px sans-serif";
  ctx.textAlign = "center"; ctx.fillText(S.lx || "x", mL + (W - mL - mR) / 2, H - 10);
  ctx.textAlign = "left"; ctx.fillText(S.ly || "y", mL, mT - 12);
  // 추세선
  if(fit){
    ctx.save(); ctx.beginPath(); ctx.rect(mL, mT, W - mL - mR, H - mT - mB); ctx.clip();
    ctx.strokeStyle = "#f97316"; ctx.lineWidth = big ? 3 : 2.2;
    ctx.beginPath(); ctx.moveTo(X(rx.lo), Y(fit.a * rx.lo + fit.b)); ctx.lineTo(X(rx.hi), Y(fit.a * rx.hi + fit.b)); ctx.stroke();
    ctx.restore();
  }
  // 점
  P.forEach(p => {
    ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(X(p.x), Y(p.y), big ? 7 : 5, 0, 7); ctx.fill();
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.2; ctx.stroke();
  });
  // 식 (그림 안에도 적어 PNG에 남게)
  if(fit){
    const t1 = eqText(fit), t2 = "R² = " + sig3(fit.r2) + "  (점 " + fit.n + "개)";
    ctx.font = "600 " + (big ? 18 : 13) + "px sans-serif"; ctx.textAlign = "left";
    const w = Math.max(ctx.measureText(t1).width, ctx.measureText(t2).width) + 16, lh = big ? 24 : 18;
    // 추세선과 덜 겹치는 쪽(기울기 +면 오른쪽 아래, −면 오른쪽 위)
    const bx = W - mR - w - 6, by = fit.a >= 0 ? H - mB - lh * 2 - 14 : mT + 6;
    ctx.fillStyle = "rgba(15,23,42,.88)"; ctx.fillRect(bx, by, w, lh * 2 + 8);
    ctx.fillStyle = "#fdba74"; ctx.fillText(t1, bx + 8, by + lh);
    ctx.fillStyle = "#e2e8f0"; ctx.font = (big ? 16 : 12) + "px sans-serif"; ctx.fillText(t2, bx + 8, by + lh * 2);
  } else {
    ctx.fillStyle = "#94a3b8"; ctx.textAlign = "center"; ctx.font = (big ? 18 : 14) + "px sans-serif";
    ctx.fillText("측정값을 2개 이상 넣으면 추세선이 그려져요", W / 2, H / 2);
  }
}
function eqText(f){
  const A = sig3(f.a).replace("-", "−");
  if(S.fit === "org") return "y = " + A + " x";
  return "y = " + A + " x " + (f.b < 0 ? "− " + sig3(-f.b) : "+ " + sig3(f.b));
}

function info(){
  const { P, bad } = points(), f = lsq(P.map(p => p.x), P.map(p => p.y), S.fit);
  $("va").textContent = f ? sig3(f.a).replace("-", "−") : "–";
  $("vb").textContent = f ? (S.fit === "org" ? "0 (고정)" : sig3(f.b).replace("-", "−")) : "–";
  $("vr").textContent = f ? sig3(f.r2) : "–";
  $("eq").textContent = f ? eqText(f) : "";
  let w = "";
  if(bad.length) w = `${bad.join(", ")}번 행은 그래프에서 뺐어요 (숫자가 아니거나, √에 음수 · 1/0 처럼 변환할 수 없는 값).`;
  $("warn").textContent = w;
  let a = `<div class="note">그래프에 그린 값: 가로 <b>${TR[S.tx].x}</b>, 세로 <b>${TR[S.ty].y}</b>. 최소제곱법으로 점들과 가장 가까운 직선을 구해요.
    R²가 1에 가까울수록 점들이 직선에 잘 맞아요.${S.fit === "org" ? " (원점 지나는 직선의 R²는 엑셀과 같은 방식: 1 − 잔차 제곱합/Σy²)" : ""}</div>`;
  if(S.ana === "shm"){
    const th = 4 * Math.PI * Math.PI / 20;
    a += `<div style="margin-top:8px">단진동 주기 T = 2π√(m/k) → <b>T² = (4π²/k)·m</b> — m–T² 그래프는 원점을 지나는 직선이고 기울기 = 4π²/k.</div>`;
    if(f && f.a > 0) a += `<div>용수철 상수 <b>k = 4π²/기울기 = 4π²/${sig3(f.a)} = ${sig3(4 * Math.PI * Math.PI / f.a)} N/m</b></div>`;
    a += `<div class="muted">비교: k = 20 N/m 이면 이론 기울기 4π²/20 = ${sig3(th)} s²/kg${f && f.a > 0 ? ` (측정 기울기와 차이 ${(Math.abs(f.a - th) / th * 100).toFixed(1)}%)` : ""}</div>`;
  } else if(S.ana === "ohm"){
    a += `<div style="margin-top:8px">옴의 법칙 V = IR → <b>I = (1/R)·V</b> — V–I 그래프의 기울기 = 1/R.</div>`;
    if(f && f.a > 0) a += `<div>저항 <b>R = 1/기울기 = 1/${sig3(f.a)} = ${sig3(1 / f.a)} Ω</b></div>`;
  }
  $("ana").innerHTML = a;
}

function table(){
  $("tb").innerHTML = S.rows.map((r, i) => `<tr><td class="n">${i + 1}</td>
    <td><input inputmode="decimal" autocomplete="off" data-r="${i}" data-c="0" value="${CS.esc(r[0])}"></td>
    <td><input inputmode="decimal" autocomplete="off" data-r="${i}" data-c="1" value="${CS.esc(r[1])}"></td>
    <td class="d"><button class="del" data-del="${i}" aria-label="${i + 1}번 행 삭제">✕</button></td></tr>`).join("");
  $("tb").querySelectorAll("input").forEach(inp => {
    inp.oninput = () => { S.rows[+inp.dataset.r][+inp.dataset.c] = inp.value; save(); info(); draw(); };
    inp.onkeydown = e => { if(e.key === "Enter"){ e.preventDefault(); const all = [...$("tb").querySelectorAll("input")], k = all.indexOf(inp);
      if(k + 1 < all.length) all[k + 1].focus(); else { addRow(); } } };
  });
  $("tb").querySelectorAll("[data-del]").forEach(b => b.onclick = () => {
    S.rows.splice(+b.dataset.del, 1); if(!S.rows.length) S.rows.push(["", ""]); save(); refresh();
  });
}
function addRow(){ S.rows.push(["", ""]); save(); table(); const all = $("tb").querySelectorAll("input"); all[all.length - 2].focus(); }
function controls(){
  $("lx").value = S.lx; $("ly").value = S.ly; $("tx").value = S.tx; $("ty").value = S.ty; $("anaSel").value = S.ana;
  document.querySelectorAll("[data-fit]").forEach(b => b.classList.toggle("on", b.dataset.fit === S.fit));
}
function heads(){ $("hx").textContent = "x 입력값" + (S.tx !== "id" ? " → " + TR[S.tx].x : ""); $("hy").textContent = "y 입력값" + (S.ty !== "id" ? " → " + TR[S.ty].y : ""); }
function refresh(){ heads(); controls(); table(); info(); draw(); }

$("lx").oninput = e => { S.lx = e.target.value; save(); draw(); };
$("ly").oninput = e => { S.ly = e.target.value; save(); draw(); };
$("tx").onchange = e => { S.tx = e.target.value; save(); heads(); info(); draw(); };
$("ty").onchange = e => { S.ty = e.target.value; save(); heads(); info(); draw(); };
$("anaSel").onchange = e => { S.ana = e.target.value; save(); info(); };
document.querySelectorAll("[data-fit]").forEach(b => b.onclick = () => { S.fit = b.dataset.fit; save(); refresh(); });
$("bAdd").onclick = addRow;
$("bClr").onclick = () => {
  if(!confirm("입력한 측정값과 축 이름을 모두 지울까요?")) return;
  S = BLANK(); save(); $("pngBox").innerHTML = ""; refresh(); CS.toast("지웠어요");
};
// 예시 데이터
$("exShm").onclick = () => {
  // k = 20 N/m 용수철, 이론 T = 2π√(m/k): 0.444, 0.628, 0.770, 0.889, 0.993 s → 측정 오차를 조금 넣은 값
  S = Object.assign(BLANK(), { lx: "질량 m (kg)", ly: "주기² T² (s²)", tx: "id", ty: "sq", fit: "lin", ana: "shm",
    rows: [["0.10", "0.45"], ["0.20", "0.62"], ["0.30", "0.78"], ["0.40", "0.88"], ["0.50", "1.00"]] });
  save(); refresh(); CS.toast("y 입력값은 주기 T(s) — 그래프에는 T²로 그려요");
};
$("exOhm").onclick = () => {
  // 10 Ω 저항, 측정 오차를 조금 넣은 값
  S = Object.assign(BLANK(), { lx: "전압 V (V)", ly: "전류 I (A)", tx: "id", ty: "id", fit: "lin", ana: "ohm",
    rows: [["1.0", "0.098"], ["2.0", "0.205"], ["3.0", "0.297"], ["4.0", "0.402"], ["5.0", "0.495"]] });
  save(); refresh(); CS.toast("옴의 법칙 예시를 불러왔어요");
};
// PNG 저장
$("bPng").onclick = () => {
  let url;
  try { url = cv.toDataURL("image/png"); } catch(e){ CS.toast("저장할 수 없어요"); return; }
  const a = document.createElement("a");
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  a.href = url; a.download = `graph_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}.png`;
  document.body.appendChild(a); a.click(); a.remove();
  $("pngBox").innerHTML = `<div class="note" style="margin-top:8px">다운로드가 안 되면 아래 그림을 길게 눌러 저장하세요.</div><img alt="저장할 그래프" src="${url}">`;
};

let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(resize, 80); });
refresh(); resize();
})();
</script>
</body>
</html>
