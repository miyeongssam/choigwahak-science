<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="icon" href="../icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>중화 반응 2 · 최과학 과학</title>
<link rel="stylesheet" href="../common/common.css">
<style>
  /* ── 한 화면 고정: 스크롤 없음 ── */
  html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
  body{min-height:0;display:flex;flex-direction:column;user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .top{position:relative;flex:0 0 auto;padding:calc(env(safe-area-inset-top) + 3px) 8px 3px;gap:8px}
  .top .back{padding:4px 10px;font-size:14px;border-radius:9px}
  .top h1{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .top h1 small{display:inline;font-size:11px;margin-left:6px}
  @media (max-width:430px){ .top h1 small{display:none} }
  .tb{width:34px;height:30px;border-radius:9px;background:var(--card2);border:1px solid var(--line);color:var(--text);
    font-size:16px;font-weight:800;cursor:pointer;padding:0;font-family:inherit;line-height:1}
  #app.wrap{max-width:none;margin:0;padding:0;flex:1 1 auto;min-height:0;display:flex;flex-direction:column;width:100%}
  #stage{position:relative;flex:1 1 auto;min-height:0;overflow:hidden}
  #cv{position:absolute;left:0;top:0;width:100%;height:100%;border:0;border-radius:0;background:transparent;pointer-events:none;z-index:2}
  .tab{position:absolute;inset:0;display:flex;flex-direction:column;gap:6px;padding:6px 8px;z-index:1;font-size:15px}
  .slot{flex:1 1 0;min-height:0;min-width:0;position:relative}
  .bar{display:flex;gap:6px;align-items:center;flex:0 0 auto;min-width:0}
  /* 아래 탭 */
  #tabs{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:3px 6px calc(env(safe-area-inset-bottom) + 3px);
    border-top:1px solid var(--line);background:#0a0a0b}
  #tabs button{display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;color:var(--muted);
    font-family:inherit;font-size:12px;font-weight:600;padding:3px 0 2px;border-radius:10px;cursor:pointer}
  #tabs button svg{width:28px;height:28px}
  #tabs button.on{color:#fff;background:var(--card2)}
  /* 버튼 */
  .k{background:var(--card2);border:2px solid var(--line);color:var(--text);border-radius:13px;font-family:inherit;font-weight:800;
    font-size:17px;cursor:pointer;padding:0 10px;height:46px;display:inline-flex;align-items:center;justify-content:center;gap:4px;min-width:46px;line-height:1}
  .k:active{transform:scale(.96)}
  .k.on{border-color:#fcd34d;background:#2e2a16}
  .k:disabled{opacity:.35}
  .k svg{width:24px;height:24px}
  .grow{flex:1 1 0;min-width:0}
  .stars{margin-left:auto;font-weight:800;font-size:16px;white-space:nowrap;color:#fde68a}
  /* 이온 동그라미(HTML) */
  .io{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;font-weight:800;border:2px solid rgba(0,0,0,.4);
    flex:0 0 auto;line-height:1;letter-spacing:-.02em;white-space:nowrap;box-sizing:border-box}
  .mol{display:inline-flex;align-items:center;flex:0 0 auto}
  .mol .io + .io{margin-left:-.28em}
  .ic{width:1.2em;height:1.2em;vertical-align:middle;flex:0 0 auto}
  /* 피드백 */
  @keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
  .shake{animation:shk .4s}
  .bad{border-color:#f87171!important;background:rgba(239,68,68,.25)!important}
  .good{border-color:#4ade80!important;background:rgba(34,197,94,.28)!important;box-shadow:0 0 18px rgba(34,197,94,.6)}
  @keyframes pul{0%,100%{box-shadow:0 0 0 0 rgba(250,204,21,.7)}50%{box-shadow:0 0 0 6px rgba(250,204,21,0)}}
  .now{animation:pul 1.1s infinite;border-color:#fcd34d!important}
  @keyframes tap{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.85}50%{transform:translate(-50%,-40%) scale(.85);opacity:1}}
  .hint{position:absolute;left:50%;top:55%;font-size:42px;pointer-events:none;animation:tap 1.2s infinite;z-index:3}

  /* ── 탭1 쪼개기 ── */
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;flex:0 0 auto}
  .card{height:42px;border-radius:11px;border:2px solid var(--line);background:var(--card2);color:var(--text);font-family:inherit;
    font-weight:800;font-size:14px;cursor:pointer;padding:0 2px;white-space:nowrap;letter-spacing:-.02em}
  .card.a{border-bottom:4px solid #f87171}
  .card.b{border-bottom:4px solid #60a5fa}
  .card.on{border-color:#fcd34d;background:#2e2a16}
  .mid{display:flex;gap:6px;flex:1 1 0;min-height:0}
  .cnt{display:flex;flex-direction:column;justify-content:center;gap:8px;flex:0 0 auto;min-width:96px}
  .cr{display:flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:5px 8px;font-size:15px}
  .cr b{font-size:24px;font-variant-numeric:tabular-nums;min-width:1.6em;text-align:right}
  .cr.arrow{background:none;border:0;justify-content:center;padding:0;color:var(--muted);font-size:18px}
  #t1q{flex:0 0 72px}
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;flex:0 0 auto}
  .tile{height:58px;border-radius:14px;border:2px solid var(--line);background:var(--card2);color:#fff;font-family:inherit;
    font-weight:800;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:3px;padding:2px;line-height:1;min-width:0}
  .tile:active{transform:scale(.97)}

  /* ── 탭2 농도·부피 ── */
  .ask{justify-content:center;font-size:30px;font-weight:900;height:44px}
  .mult{display:grid;grid-template-columns:1fr 1fr;gap:6px;flex:0 0 auto;visibility:hidden;min-height:50px}
  .mult.show{visibility:visible}
  .mr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:14px;font-weight:700;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px 4px;min-width:0}
  .mr .l{display:flex;align-items:center;gap:3px;flex-wrap:nowrap;white-space:nowrap}
  .mr .x{color:var(--muted);font-weight:600}
  .mr b{font-size:16px}
  .btn3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;flex:0 0 auto}
  .btn3 .k{height:52px;font-size:22px}

  /* ── 탭3 섞기 ── */
  .t3main{display:flex;flex-direction:column;gap:6px;flex:1 1 0;min-height:0}
  .t3top{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;flex:1 1 0;min-height:0}
  .side{display:flex;flex-direction:column;gap:4px;min-height:0;min-width:0}
  .side.lock .ctl{opacity:.35;pointer-events:none}
  .ctl{display:flex;flex-direction:column;gap:4px;flex:0 0 auto}
  .stp{display:grid;grid-template-columns:40px 1fr 40px;gap:4px;align-items:center}
  .stp .k{height:36px;min-width:0;padding:0;font-size:22px;border-radius:10px}
  .stp .v{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:18px;white-space:nowrap;min-width:0}
  .card.big{height:36px;width:100%;font-size:16px}
  .midc{display:flex;align-items:center;justify-content:center}
  #mixBtn{width:64px;height:64px;border-radius:50%;border:3px solid #fcd34d;background:#2e2a16;color:#fff;cursor:pointer;padding:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:inherit;font-size:11px;font-weight:800;gap:0}
  #mixBtn svg{width:36px;height:36px}
  #mixBtn:active{transform:scale(.94)}
  #t3mS{flex:.95 1 0}

  /* ── 탭4 게임 ── */
  .hud{height:40px}
  .tbar{flex:1 1 0;height:14px;background:var(--card2);border-radius:8px;overflow:hidden;border:1px solid var(--line)}
  .tbar>div{height:100%;width:100%;background:linear-gradient(90deg,#4ade80,#fcd34d)}
  .sc{font-weight:900;font-size:20px;min-width:54px;text-align:right;white-space:nowrap}
  .cb{font-weight:900;font-size:16px;color:#fb923c;min-width:44px;white-space:nowrap}
  .t4tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:0 0 auto}
  .t4tiles.c3{grid-template-columns:1fr 1fr 1fr}
  .t4tiles .tile{height:66px;font-size:26px}
  .t4tiles.c3 .tile{height:76px}
  .sw{width:46px;height:46px;border-radius:10px 10px 16px 16px;border:3px solid #d4d4d8;border-top:0}
  .ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    background:rgba(0,0,0,.9);z-index:4;text-align:center}
  .ov .bigs{font-size:64px;font-weight:900;line-height:1}
  .ov .k{height:58px;font-size:22px;padding:0 22px}
  .ov .row2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
  .play{width:120px;height:120px;border-radius:50%;border:4px solid #4ade80;background:#14261b;color:#fff;font-size:54px;cursor:pointer;padding:0 0 0 10px}

  /* 말풍선 */
  #bubble{position:fixed;right:8px;top:calc(env(safe-area-inset-top) + 42px);max-width:min(320px,90vw);background:#fffbeb;color:#1f2937;
    border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.55;z-index:30;box-shadow:0 8px 30px rgba(0,0,0,.5);font-weight:600}
  #bubble:before{content:"";position:absolute;right:52px;top:-8px;border:8px solid transparent;border-top:0;border-bottom-color:#fffbeb}

  /* 가로로 넓은 화면(칠판) */
  @media (min-aspect-ratio:5/4) and (min-width:700px){
    .t3main{flex-direction:row}
    .t3top{flex:1.2 1 0}
    .t4body{flex-direction:row!important}
    .t4body .t4tiles{width:38%;align-content:center}
    .t4body .t4tiles .tile{height:auto;min-height:110px}
  }
  @media (min-width:1000px) and (min-height:700px){
    .top{padding-top:calc(env(safe-area-inset-top) + 6px);padding-bottom:6px}
    .top h1{font-size:22px} .top h1 small{font-size:14px}
    .top .back{font-size:17px;padding:7px 14px}
    .tb{width:44px;height:40px;font-size:20px}
    #tabs button{font-size:17px} #tabs button svg{width:40px;height:40px}
    .tab{gap:12px;padding:12px 20px;font-size:20px}
    .card{height:64px;font-size:24px} .card.big{height:52px;font-size:22px}
    .k{height:64px;font-size:24px;min-width:64px} .k svg{width:34px;height:34px}
    .cnt{min-width:170px;gap:14px} .cr{font-size:22px;padding:8px 14px} .cr b{font-size:40px}
    #t1q{flex-basis:130px}
    .tile{height:92px;font-size:40px} .t4tiles .tile{font-size:42px}
    .ask{height:70px;font-size:48px}
    .mult{min-height:90px} .mr{font-size:22px} .mr b{font-size:26px}
    .btn3 .k{height:76px;font-size:32px}
    .stp{grid-template-columns:60px 1fr 60px} .stp .k{height:52px;font-size:30px} .stp .v{font-size:28px}
    #mixBtn{width:110px;height:110px;font-size:17px} #mixBtn svg{width:60px;height:60px}
    .hud{height:60px} .tbar{height:22px} .sc{font-size:32px;min-width:90px} .cb{font-size:26px}
    .stars{font-size:26px}
    .sw{width:80px;height:80px}
    #bubble{font-size:20px;top:64px;max-width:460px}
    .hint{font-size:90px}
  }
</style>
</head>
<body>
<header class="top"><a class="back" href="../">‹ 홈</a><h1>중화 반응 2<small>통합과학 · 이온 개수 놀이</small></h1>
  <div class="tools"><button class="tb" id="bHelp" aria-label="도움말">?</button><button class="tb" id="bSnd" aria-label="소리">🔊</button></div></header>
<div class="wrap" id="app">
<main id="stage">
  <canvas id="cv"></canvas>

  <!-- 1 쪼개기 -->
  <section class="tab" id="t1">
    <div class="cards" id="t1cards"></div>
    <div class="slot hide" id="t1q"></div>
    <div class="mid">
      <div class="slot" id="t1beak"><div class="hint" id="t1hint">👆</div></div>
      <div class="cnt" id="t1cnt"></div>
    </div>
    <div class="tiles hide" id="t1tiles"></div>
    <div class="bar">
      <button class="k" id="t1x10">×10</button>
      <button class="k" id="t1clr" aria-label="비우기">⟲</button>
      <button class="k" id="t1ch" aria-label="도전">🎯</button>
      <span class="stars" id="t1st"></span>
    </div>
  </section>

  <!-- 2 농도·부피 -->
  <section class="tab hide" id="t2">
    <div class="bar ask" id="t2ask"></div>
    <div class="slot" id="t2beak"></div>
    <div class="mult" id="t2mult"><div class="mr" id="t2mA"></div><div class="mr" id="t2mB"></div></div>
    <div class="btn3" id="t2btn">
      <button class="k" data-v="0">(가)</button><button class="k" data-v="1">=</button><button class="k" data-v="2">(나)</button>
    </div>
    <div class="bar hide" id="t2next"><span class="stars" id="t2st" style="margin:0"></span><button class="k grow" id="t2go">▶</button></div>
  </section>

  <!-- 3 섞기 -->
  <section class="tab hide" id="t3">
    <div class="t3main" id="t3free">
      <div class="t3top">
        <div class="side" id="t3A">
          <div class="slot" id="t3aS"></div>
          <div class="ctl">
            <button class="card big a" id="t3aM"></button>
            <div class="stp"><button class="k" data-s="a" data-f="c" data-d="-1">−</button><span class="v" id="t3aC"></span><button class="k" data-s="a" data-f="c" data-d="1">+</button></div>
            <div class="stp"><button class="k" data-s="a" data-f="p" data-d="-1">−</button><span class="v" id="t3aP"></span><button class="k" data-s="a" data-f="p" data-d="1">+</button></div>
          </div>
        </div>
        <div class="midc"><button id="mixBtn" aria-label="섞기"></button></div>
        <div class="side" id="t3B">
          <div class="slot" id="t3bS"></div>
          <div class="ctl">
            <button class="card big b" id="t3bM"></button>
            <div class="stp"><button class="k" data-s="b" data-f="c" data-d="-1">−</button><span class="v" id="t3bC"></span><button class="k" data-s="b" data-f="c" data-d="1">+</button></div>
            <div class="stp"><button class="k" data-s="b" data-f="p" data-d="-1">−</button><span class="v" id="t3bP"></span><button class="k" data-s="b" data-f="p" data-d="1">+</button></div>
          </div>
        </div>
      </div>
      <div class="slot" id="t3mS"></div>
    </div>
    <div class="slot hide" id="t3hotS"></div>
    <div class="bar">
      <button class="k on" id="t3m0" aria-label="자유">🧪</button>
      <button class="k" id="t3m1" aria-label="중성 만들기">🎯</button>
      <button class="k" id="t3m2" aria-label="온도 높게">🌡️</button>
      <button class="k hide" id="t3go">▶</button>
      <span class="stars" id="t3st"></span>
    </div>
  </section>

  <!-- 4 게임 -->
  <section class="tab hide" id="t4">
    <div class="bar hud"><span class="cb" id="t4cb"></span><div class="tbar"><div id="t4tb"></div></div><span class="sc" id="t4sc">0</span></div>
    <div class="t4body" style="display:flex;flex-direction:column;gap:8px;flex:1 1 0;min-height:0">
      <div class="slot" id="t4fig"></div>
      <div class="t4tiles" id="t4tiles"></div>
    </div>
    <div class="ov" id="t4start"><button class="play" id="t4play" aria-label="시작">▶</button><div class="bigs" style="font-size:40px">🏆 <span id="t4best0">0</span></div><div style="font-size:28px;font-weight:900;color:var(--muted)">60″</div></div>
    <div class="ov hide" id="t4end"></div>
  </section>
</main>
<nav id="tabs">
  <button data-t="1"><svg viewBox="0 0 32 32"><circle cx="8" cy="11" r="5.5" fill="#f87171" stroke="#000" stroke-opacity=".4"/><circle cx="8" cy="23" r="5.5" fill="#f87171" stroke="#000" stroke-opacity=".4"/><circle cx="24" cy="17" r="6.5" fill="#fcd34d" stroke="#000" stroke-opacity=".4"/><path d="M15 9l2.5 2M15 25l2.5-2M14.5 17h3" stroke="#ececee" stroke-width="2" stroke-linecap="round"/></svg>쪼개기</button>
  <button data-t="2"><svg viewBox="0 0 32 32" fill="none" stroke="#d4d4d8" stroke-width="2"><path d="M3 8v20h11V8"/><path d="M18 18v10h11V18"/><rect x="4" y="15" width="9" height="12" fill="#fcd34d" fill-opacity=".55" stroke="none"/><rect x="19" y="21" width="9" height="6" fill="#fcd34d" fill-opacity=".55" stroke="none"/><path d="M4 21h9M19 24h9" stroke-dasharray="2 2"/></svg>부피</button>
  <button data-t="3"><svg viewBox="0 0 32 32" fill="none" stroke="#d4d4d8" stroke-width="2"><path d="M12 3h8M13 3v9L5 26a2 2 0 0 0 2 3h18a2 2 0 0 0 2-3l-8-14V3"/><path d="M8.5 21h15L26 26a1.5 1.5 0 0 1-1.3 2H7.3A1.5 1.5 0 0 1 6 26z" fill="#4ade80" stroke="none"/></svg>섞기</button>
  <button data-t="4"><svg viewBox="0 0 32 32"><rect x="2" y="9" width="28" height="16" rx="8" fill="#2a2a2e" stroke="#d4d4d8" stroke-width="2"/><path d="M9 13v8M5 17h8" stroke="#ececee" stroke-width="2.4" stroke-linecap="round"/><circle cx="21" cy="15" r="2.2" fill="#f87171"/><circle cx="25" cy="19" r="2.2" fill="#60a5fa"/></svg>게임</button>
</nav>

<script>"use strict";
// ==CORE== (정답 계산 · 문제 만들기 — 검사 스크립트가 이 부분만 떼어 node에서 실행)
let RND = Math.random;
const ri = (a, b) => a + Math.floor(RND() * (b - a + 1));
const pk = a => a[Math.floor(RND() * a.length)];
const shuf = a => { a = a.slice(); for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(RND() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const ION = {
  H:  {s:"H⁺",    q:1,  c:"#f87171", t:"#3b0707"},
  OH: {s:"OH⁻",   q:-1, c:"#60a5fa", t:"#0a1c40"},
  Na: {s:"Na⁺",   q:1,  c:"#c084fc", t:"#2e1065"},
  K:  {s:"K⁺",    q:1,  c:"#e879f9", t:"#4a044e"},
  Ca: {s:"Ca²⁺",  q:2,  c:"#8b5cf6", t:"#fff"},
  Cl: {s:"Cl⁻",   q:-1, c:"#4ade80", t:"#052e16"},
  NO3:{s:"NO₃⁻",  q:-1, c:"#bef264", t:"#1a2e05"},
  SO4:{s:"SO₄²⁻", q:-2, c:"#fcd34d", t:"#422006"},
  W:  {s:"H₂O",   q:0,  c:"#7dd3fc", t:"#0c4a6e"}
};
// 화학식 단위 1개가 물에 녹으면 나오는 이온 (완전히 이온화한다고 가정)
const MOL = {
  HCl:   {f:"HCl",     k:"a", io:[["H",1],["Cl",1]]},
  HNO3:  {f:"HNO₃",    k:"a", io:[["H",1],["NO3",1]]},
  H2SO4: {f:"H₂SO₄",   k:"a", io:[["H",2],["SO4",1]]},
  NaOH:  {f:"NaOH",    k:"b", io:[["Na",1],["OH",1]]},
  KOH:   {f:"KOH",     k:"b", io:[["K",1],["OH",1]]},
  CaOH2: {f:"Ca(OH)₂", k:"b", io:[["Ca",1],["OH",2]]}
};
const ACIDS = ["HCl","HNO3","H2SO4"], BASES = ["NaOH","KOH","CaOH2"], ALLM = ACIDS.concat(BASES);
const MAXI = 30, MAXC = 5, MAXP = 4;         // 이온 한 종류 최대 30개, 칸 1~5, 1칸당 분자 1~4
const coefOf = (m, sp) => { const e = MOL[m].io.find(x => x[0] === sp); return e ? e[1] : 0; };
const valOf = m => coefOf(m, MOL[m].k === "a" ? "H" : "OH");                 // 가수
const partner = m => MOL[m].io.find(x => x[0] !== "H" && x[0] !== "OH")[0];  // 구경꾼 이온
const keyIon = m => MOL[m].k === "a" ? "H" : "OH";
function ionsOf(m, n){ const o = {}; MOL[m].io.forEach(([sp, k]) => o[sp] = k * n); return o; }
const solN = s => s.c * s.p;                    // 분자 수 = 칸 수 × 1칸당 분자 수
const solIons = s => ionsOf(s.m, solN(s));      // 이온 수 = 칸 × 1칸당 분자 × 가수
const solOk = s => s.c >= 1 && s.c <= MAXC && s.p >= 1 && s.p <= MAXP && MOL[s.m].io.every(([sp, k]) => k * s.c * s.p <= MAXI);
const isPrecip = (a, b) => a === "H2SO4" && b === "CaOH2";   // CaSO₄ 앙금 → 섞기·게임에서 제외
const gcd = (a, b) => { a = Math.abs(a); b = Math.abs(b); while(b){ [a, b] = [b, a % b]; } return a; };
const simp = arr => { const g = arr.reduce((s, x) => gcd(s, x), 0) || 1; return arr.map(x => x / g); };
const rstr = a => a.join(" : ");
const charge = o => Object.keys(o).reduce((s, k) => s + ION[k].q * o[k], 0);
const fmt = x => Number.isInteger(x) ? String(x) : String(Math.round(x * 10) / 10);

/* 정답 계산 함수(하나뿐): 산 용액 a + 염기 용액 b (각각 {m, c:칸 수, p:1칸당 분자 수}) */
function mix(a, b){
  const ia = solIons(a), ib = solIons(b), H = ia.H, OH = ib.OH, water = Math.min(H, OH);
  const an = partner(a.m), cat = partner(b.m);
  const rem = {H:H - water, [an]:ia[an], [cat]:ib[cat], OH:OH - water};
  const order = ["H", an, cat, "OH"].filter(k => rem[k] > 0);
  const cnt = order.map(k => rem[k]);
  return { ia, ib, H, OH, water, an, cat, rem, order, cnt, ratio:simp(cnt), cells:a.c + b.c,
    nature: rem.H > 0 ? "A" : rem.OH > 0 ? "B" : "N",
    qBefore: charge(ia) + charge(ib), qAfter: charge(rem) };
}
function randSol(kind, m){
  for(let g = 0; g < 1000; g++){ const s = {m: m || pk(kind === "a" ? ACIDS : BASES), c:ri(1, MAXC), p:ri(1, MAXP)}; if(solOk(s)) return s; }
}
function randPair(want){
  for(let g = 0; g < 20000; g++){
    const a = randSol("a"), b = randSol("b");
    if(isPrecip(a.m, b.m)) continue;
    const r = mix(a, b);
    if(want && r.nature !== want) continue;
    return {a, b, r};
  }
}
function numTiles(ans, cands, n){
  n = n || 4;
  const out = [ans], seen = new Set([fmt(ans)]);
  for(const c of cands){ if(!(c > 0)) continue; const f = fmt(c); if(seen.has(f)) continue; seen.add(f); out.push(c); if(out.length === n) break; }
  for(let x = ans + 1; out.length < n; x++){ if(!seen.has(fmt(x))){ seen.add(fmt(x)); out.push(x); } }
  const sh = shuf(out);
  return {tiles: sh.map(fmt), ans: sh.indexOf(ans)};
}
// 분자 n개 → 이온 sp 개수, 실수하기 쉬운 오답(가수 빠뜨림·두 번 곱함·나눔)
function ionTiles(m, sp, n){
  const k = coefOf(m, sp), other = MOL[m].io.find(x => x[0] !== sp)[1], ans = k * n;
  let c;
  if(k === 2) c = [n].concat(shuf([3 * n, n / 2, 4 * n, n + 2, 2 * n + 2]));
  else if(other === 2) c = [2 * n].concat(shuf([n / 2, 3 * n, n + 1, n + 2]));
  else c = [2 * n].concat(shuf([n / 2, n + 1, n - 1, 3 * n]));
  return numTiles(ans, c);
}
function genSplit(){
  const m = pk(ALLM), mx = Math.floor(MAXI / Math.max(...MOL[m].io.map(x => x[1])));
  const n = ri(2, Math.min(15, mx));
  return { m, n, steps: MOL[m].io.map(([sp, k]) => Object.assign({sp, val:k * n}, ionTiles(m, sp, n))) };
}
function genCompare(){
  const r0 = RND(), want = r0 < 0.3 ? "eq" : r0 < 0.65 ? "trap" : "any";
  const kind = RND() < 0.5 ? "a" : "b", sp = kind === "a" ? "H" : "OH", diffVal = RND() < 0.5;
  for(let g = 0; g < 50000; g++){
    const A = randSol(kind), B = randSol(kind);
    if(A.m === B.m && A.c === B.c && A.p === B.p) continue;
    const nA = solIons(A)[sp], nB = solIons(B)[sp];
    if(want === "eq"){ if(nA !== nB) continue; }
    else {
      if(nA === nB) continue;
      if(want === "trap"){ if(A.c === B.c) continue; const big = A.c > B.c ? nA : nB, small = A.c > B.c ? nB : nA; if(big >= small) continue; }
      else if(diffVal && valOf(A.m) === valOf(B.m)) continue;
    }
    return {type:"cmp", A, B, sp, nA, nB, want, tiles:["A","=","B"], ans: nA > nB ? 0 : nA === nB ? 1 : 2};
  }
}
const GTYPES = ["mi","cmp","col","rem","wat","rat"];
function genGame(type){
  type = type || pk(GTYPES);
  if(type === "mi"){
    const m = pk(ALLM), mx = Math.floor(MAXI / Math.max(...MOL[m].io.map(x => x[1]))), n = ri(2, Math.min(15, mx));
    const sp = RND() < 0.65 ? keyIon(m) : pk(MOL[m].io.map(x => x[0]));
    const t = ionTiles(m, sp, n);
    return {type, m, n, sp, val:coefOf(m, sp) * n, tiles:t.tiles, ans:t.ans};
  }
  if(type === "cmp") return genCompare();
  if(type === "col"){
    const P = randPair(pk(["A","N","B"]));
    return {type, a:P.a, b:P.b, r:P.r, tiles:["A","N","B"], ans:["A","N","B"].indexOf(P.r.nature)};
  }
  if(type === "rem"){
    const P = randPair(pk(["A","N","B"])), an = P.r.an, cat = P.r.cat;
    const sets = shuf([["H", an, cat], [an, cat], [an, cat, "OH"], ["H", an, cat, "OH"]].map(x => x.join(",")));
    return {type, a:P.a, b:P.b, r:P.r, tiles:sets, ans:sets.indexOf(P.r.order.join(","))};
  }
  if(type === "wat"){
    const P = randPair(pk(["A","N","B"])), r = P.r;
    const t = numTiles(r.water, shuf([r.H, r.OH, r.H + r.OH, 2 * r.water, Math.abs(r.H - r.OH), r.water + 2, r.water - 1]));
    return {type, a:P.a, b:P.b, r, tiles:t.tiles, ans:t.ans};
  }
  if(type === "rat"){
    const P = randPair(RND() < 0.8 ? pk(["A","B"]) : "N"), r = P.r, ans = r.ratio;
    const seen = new Set([rstr(ans)]), out = [];
    const add = arr => { if(out.length >= 3 || arr.some(x => !(x > 0) || !Number.isInteger(x))) return; const s = rstr(simp(arr)); if(!seen.has(s)){ seen.add(s); out.push(s); } };
    add(r.order.map(k => k === "H" ? r.H : k === "OH" ? r.OH : r.rem[k]));      // 반응 전 개수 그대로
    const perm = a => a.length <= 1 ? [a] : a.flatMap((x, i) => perm(a.slice(0, i).concat(a.slice(i + 1))).map(p => [x].concat(p)));
    shuf(perm(ans)).forEach(add);
    for(let g = 0; out.length < 3 && g < 300; g++) add(ans.map(x => Math.max(1, x + ri(-1, 2))));
    for(let g = 0; out.length < 3 && g < 3000; g++) add(ans.map(() => ri(1, 6)));
    const tiles = shuf([rstr(ans)].concat(out));
    return {type, a:P.a, b:P.b, r, tiles, ans:tiles.indexOf(rstr(ans))};
  }
}
// 섞기 도전: 산은 고정, 염기를 맞춰 중성 만들기
function genGreen(){
  for(let g = 0; g < 5000; g++){
    const a = randSol("a"), bm = pk(BASES.filter(b => !isPrecip(a.m, b))), H = solIons(a).H, sols = [];
    for(let c = 1; c <= MAXC; c++) for(let p = 1; p <= MAXP; p++){ const s = {m:bm, c, p}; if(solOk(s) && solIons(s).OH === H) sols.push(s); }
    if(!sols.length) continue;
    for(let h = 0; h < 200; h++){ const b = randSol("b", bm); if(mix(a, b).nature !== "N") return {a, b, sols}; }
  }
}
// 섞기 도전2: 전체 부피(칸 수 합)가 같은 조합 중 물이 가장 많이 생기는 것
function genHot(){
  for(let g = 0; g < 50000; g++){
    const T = ri(3, 6), k = RND() < 0.5 ? 2 : 3, same = RND() < 0.5;
    const am = pk(ACIDS), bm = pk(BASES.filter(b => !isPrecip(am, b)));
    const combos = [], keys = new Set();
    for(let i = 0; i < k * 30 && combos.length < k; i++){
      const m1 = same ? am : pk(ACIDS), m2 = same ? bm : pk(BASES.filter(b => !isPrecip(m1, b)));
      const c = ri(1, T - 1), a = {m:m1, c, p:ri(1, MAXP)}, b = {m:m2, c:T - c, p:ri(1, MAXP)};
      if(!solOk(a) || !solOk(b) || isPrecip(a.m, b.m)) continue;
      const key = JSON.stringify([a, b]); if(keys.has(key)) continue; keys.add(key);
      combos.push({a, b, w:mix(a, b).water});
    }
    if(combos.length < k) continue;
    const ws = combos.map(x => x.w), mx = Math.max(...ws);
    if(ws.filter(w => w === mx).length !== 1) continue;
    return {T, combos, ans:ws.indexOf(mx)};
  }
}

let AC = null;
function snd(kind){
  if(!soundOn) return;
  try{
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const seq = {ok:[[660,.07],[990,.12]], bad:[[160,.2]], pop:[[700,.035]], win:[[523,.09],[659,.09],[784,.09],[1047,.2]], tick:[[440,.03]]}[kind];
    let t = AC.currentTime + .01;
    seq.forEach(([f, d]) => { const o = AC.createOscillator(), g = AC.createGain();
      o.type = kind === "bad" ? "square" : "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(kind === "pop" ? .07 : .12, t); g.gain.exponentialRampToValueAtTime(.0008, t + d);
      o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + .02); t += d; });
  }catch(e){}
}

/* HTML 그림 조각 */
function ionH(sp, s){
  const I = ION[sp], len = [...I.s].length, fs = Math.min(.5, 1.32 / Math.max(len, 2)) * s;
  return `<span class="io" style="width:${(s / fs).toFixed(3)}em;height:${(s / fs).toFixed(3)}em;font-size:${fs.toFixed(3)}em;background:${I.c};color:${I.t}">${I.s}</span>`;
}
function molH(m, s){
  const io = MOL[m].io, list = [];
  if(io.some(x => x[1] === 2)){ const two = io.find(x => x[1] === 2)[0], one = io.find(x => x[1] === 1)[0]; list.push(two, one, two); }
  else io.forEach(x => list.push(x[0]));
  return `<span class="mol">${list.map(sp => ionH(sp, s)).join("")}</span>`;
}

const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
function dIon(sp, x, y, r, a){
  if(r <= .4) return;
  if(sp === "W") return dDrop(x, y, r, a);
  const I = ION[sp];
  ctx.globalAlpha = a == null ? 1 : a;
  ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fillStyle = I.c; ctx.fill();
  ctx.lineWidth = Math.max(1, r * .12); ctx.strokeStyle = "rgba(0,0,0,.45)"; ctx.stroke();
  if(r >= 7.5){
    const len = [...I.s].length, fs = Math.min(r * 1.0, r * 2.75 / Math.max(len, 2));
    ctx.fillStyle = I.t; ctx.font = `800 ${fs}px ${FONT}`; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(I.s, x, y + fs * .06);
  }
  ctx.globalAlpha = 1;
}
function dDrop(x, y, r, a){
  if(r <= .4) return;
  ctx.globalAlpha = a == null ? 1 : a;
  ctx.beginPath(); ctx.moveTo(x, y - r * 1.2);
  ctx.quadraticCurveTo(x + r * .95, y - r * .15, x + r * .85, y + r * .25);
  ctx.arc(x, y + r * .25, r * .85, 0, Math.PI);
  ctx.quadraticCurveTo(x - r * .95, y - r * .15, x, y - r * 1.2);
  ctx.fillStyle = "#7dd3fc"; ctx.fill(); ctx.lineWidth = Math.max(1, r * .12); ctx.strokeStyle = "#0369a1"; ctx.stroke();
  ctx.globalAlpha = 1;
}
function rrect(x, y, w, h, r){ ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

/* 비커: (x,y) 몸통 왼쪽 위, w×h 몸통, level 0~1 (액체 높이), cells(눈금 칸 수), col 액체 색 */
function dBeaker(x, y, w, h, o){
  o = o || {};
  const lw = Math.max(2, w * .025), lh = h * (o.level || 0);
  if(lh > 0){
    rrect(x + lw, y + h - lh, w - 2 * lw, lh - lw * .5, [0, 0, w * .07, w * .07]);
    ctx.globalAlpha = o.alpha == null ? .32 : o.alpha; ctx.fillStyle = o.col || BTB.X; ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = o.col || BTB.X; ctx.globalAlpha = .75; ctx.fillRect(x + lw, y + h - lh, w - 2 * lw, Math.max(2, lw * .8)); ctx.globalAlpha = 1;
    if(o.cells > 1){
      ctx.save(); ctx.setLineDash([5, 4]); ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 1.5;
      for(let i = 1; i < o.cells; i++){ const yy = y + h - lh * i / o.cells; ctx.beginPath(); ctx.moveTo(x + lw, yy); ctx.lineTo(x + w - lw, yy); ctx.stroke(); }
      ctx.restore();
    }
  }
  if(o.target){ // 도전 목표: 점선 초록
    ctx.save(); ctx.setLineDash([6, 5]); ctx.strokeStyle = BTB.N; ctx.lineWidth = 2.5;
    const th = h * o.target; rrect(x + lw * 2, y + h - th, w - 4 * lw, th - lw, 6); ctx.stroke();
    ctx.globalAlpha = .12; ctx.fillStyle = BTB.N; ctx.fill(); ctx.restore();
  }
  ctx.beginPath(); const lip = w * .06;
  ctx.moveTo(x - lip, y - lip * .6); ctx.lineTo(x, y + lip * .3); ctx.lineTo(x, y + h - w * .07);
  ctx.quadraticCurveTo(x, y + h, x + w * .07, y + h); ctx.lineTo(x + w - w * .07, y + h);
  ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - w * .07); ctx.lineTo(x + w, y + lip * .3); ctx.lineTo(x + w + lip, y - lip * .6);
  ctx.strokeStyle = o.glow || "#d4d4d8"; ctx.lineWidth = lw; ctx.lineJoin = "round"; ctx.stroke();
  if(o.glow){ ctx.save(); ctx.shadowColor = o.glow; ctx.shadowBlur = 18; ctx.stroke(); ctx.restore(); }
}
function dThermo(x, y, w, h, frac){

// 분자(붙은 덩어리) 또는 쪼개진 이온 무리의 자리
function molPos(m, cx, cy, r, spread){
  const io = MOL[m].io, out = [], s = spread ? 1.3 : 1;
  if(io.some(x => x[1] === 2)){
    const two = io.find(x => x[1] === 2)[0], one = io.find(x => x[1] === 1)[0];
    out.push({sp:two, x:cx - 1.45 * r * s, y:cy - .38 * r * s}, {sp:two, x:cx + 1.45 * r * s, y:cy - .38 * r * s}, {sp:one, x:cx, y:cy + .32 * r * s});
  } else { out.push({sp:io[0][0], x:cx - .88 * r * s, y:cy}, {sp:io[1][0], x:cx + .88 * r * s, y:cy}); }

}
// 칸 비커 안 이온 자리 (칸마다 분자 p개, 분자마다 이온 무리)
function layoutSol(s, B){

  const r = Math.min(slotW / (n3 ? 6.2 : 4.7), B.cellH / (n3 ? 3.3 : 2.5), B.rMax || 22);
  const out = [];
  for(let i = 0; i < s.c; i++){

    for(let j = 0; j < s.p; j++){
      const cx = B.x + B.w * .05 + (j + .5) * slotW;
      molPos(s.m, cx, cy + (n3 ? r * .05 : 0), r, true).forEach(p => out.push({sp:p.sp, x:p.x, y:p.y, r}));
    }
  }

// 칸 비커를 영역 안에 맞추기
function beakerIn(A, cap, cells, maxW){
  const bodyH = Math.min(A.h, (maxW || A.w) * 1.5 * cap / 5.4), w = Math.min(maxW || A.w, A.w, bodyH * 5.4 / cap * .8 + 20);
  const cellH = bodyH / cap;
  return {x:A.x + (A.w - w) / 2, y:A.y + A.h - bodyH, w, h:bodyH, cellH, cells, cap, rMax:Math.min(40, Math.max(14, w / 9))};
}
function dSolBeaker(s, B, o){
  o = o || {};
  dBeaker(B.x, B.y, B.w, B.h, {level:s.c * B.cellH / B.h, cells:s.c, col:o.col || BTB[MOL[s.m].k === "a" ? "A" : "B"], glow:o.glow});
  layoutSol(s, B).forEach(p => { if(o.skip !== p.sp) dIon(p.sp, p.x, p.y, p.r, o.dim && o.dim !== p.sp ? .35 : 1); });
}
function gridSlots(n, R, rMax){
  if(!n) return {pts:[], r:rMax};
  let best = {cell:0, cols:1};
  for(let c = 1; c <= n; c++){ const rows = Math.ceil(n / c), cell = Math.min(R.w / c, R.h / rows); if(cell > best.cell) best = {cell, cols:c}; }
  const cols = best.cols, rows = Math.ceil(n / cols), cell = best.cell, r = Math.min(cell * .43, rMax);
  const ox = R.x + (R.w - cols * cell) / 2, oy = R.y + (R.h - rows * cell) / 2, pts = [];
  for(let i = 0; i < n; i++){ const col = i % cols, row = Math.floor(i / cols);
    pts.push({x:ox + (col + .5) * cell, y:oy + (rows - 1 - row + .5) * cell}); }
  return {pts, r};
}
// 종류별 한 줄 정렬 (+ 개수 자리)
function rowsLayout(groups, R, rMax){
  const L = Math.min(46, Math.max(28, R.w * .12));
  let r = rMax, lay = null;
  for(; r >= 2; r -= .5){
    const cols = Math.max(1, Math.floor((R.w - L) / (2.2 * r)));
    let lines = 0; groups.forEach(g => lines += Math.max(1, Math.ceil(g.n / cols)));
    const H = lines * 2.25 * r + (groups.length - 1) * r * .5;
    if(H <= R.h){ lay = {cols, H}; break; }
  }
  if(!lay) lay = {cols:Math.floor((R.w - L) / 4.4), H:R.h};
  let y = R.y + (R.h - lay.H) / 2;
  const items = [], labels = [];
  groups.forEach(g => {
    const lines = Math.max(1, Math.ceil(g.n / lay.cols));
    labels.push({sp:g.sp, n:g.n, x:R.x + L / 2, y:y + 1.125 * r});
    for(let i = 0; i < g.n; i++) items.push({sp:g.sp, x:R.x + L + (i % lay.cols + .5) * 2.2 * r, y:y + (Math.floor(i / lay.cols) + .5) * 2.25 * r, r});
    y += lines * 2.25 * r + r * .5;
  });
  return {items, labels, r};
}
function dLabels(labels, r){ labels.forEach(l => txt(String(l.n), l.x, l.y, Math.max(14, Math.min(30, r * 1.5)), "#fff")); }

/* 움직이는 입자: 열쇠 장면(keyframe) 사이를 부드럽게 */
function posAt(p, t){
  const k = p.k;
  if(t <= k[0].t) return k[0];
  for(let i = 1; i < k.length; i++) if(t < k[i].t){
    const a = k[i - 1], b = k[i], u = ease((t - a.t) / (b.t - a.t));
    const A = a.a == null ? 1 : a.a, Bv = b.a == null ? 1 : b.a;
    return {x:a.x + (b.x - a.x) * u, y:a.y + (b.y - a.y) * u, r:a.r + (b.r - a.r) * u, a:A + (Bv - A) * u};
  }
  return k[k.length - 1];
}
function dParts(P, t){
  let busy = false;
  P.forEach(p => {
    const last = p.k[p.k.length - 1];
    if(t < last.t) busy = true;
    if(p.late && t < p.k[0].t) return;
    if(t >= last.t && last.a === 0) return;
    const q = posAt(p, t); dIon(p.sp, q.x, q.y, q.r, q.a);
  });
  return busy;
}

/* 반짝이 · 흔들림 */
const FX = [], SHK = {};
function sparkle(x, y, n, spread){
  const t = T();
  for(let i = 0; i < (n || 18); i++){ const a = Math.random() * 6.28, v = (spread || 90) * (.4 + Math.random());
    FX.push({x, y, vx:Math.cos(a) * v, vy:Math.sin(a) * v - 40, t0:t, life:.8 + Math.random() * .4, c:["#fde047","#86efac","#fff","#f9a8d4"][i % 4]}); }
  kick();
}
function shakeOf(id, t){ const u = SHK[id]; if(!u || t > u) return 0; return Math.sin(t * 70) * 7 * (u - t) / .45; }
function shake(id){ SHK[id] = T() + .45; kick(); }
function dFx(t){
  for(let i = FX.length - 1; i >= 0; i--){
    const f = FX[i], u = (t - f.t0) / f.life;
    if(u >= 1){ FX.splice(i, 1); continue; }
    const x = f.x + f.vx * (t - f.t0), y = f.y + f.vy * (t - f.t0) + 120 * (t - f.t0) ** 2, s = 7 * (1 - u) + 2;
    ctx.globalAlpha = 1 - u; ctx.fillStyle = f.c; ctx.beginPath();
    for(let j = 0; j < 10; j++){ const rr = j % 2 ? s * .42 : s, a = j * Math.PI / 5 - Math.PI / 2; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.fill(); ctx.globalAlpha = 1;
  }
  return FX.length > 0 || Object.values(SHK).some(u => u > t);
}

/* 그리기 반복 (움직일 것이 있을 때만) */
let rafOn = false, lastT = 0;
function kick(){ if(!rafOn && !document.hidden){ rafOn = true; requestAnimationFrame(frame); } }
function frame(){
  rafOn = false;
  const t = T(), dt = Math.min(.1, Math.max(0, t - (lastT || t))); lastT = t;
  const sr = stage.getBoundingClientRect(); SR = {left:sr.left, top:sr.top};
  if(Math.abs(sr.width - CW) > .5 || Math.abs(sr.height - CH) > .5){ resize(); }
  ctx.clearRect(0, 0, CW, CH);
  let busy = false;
  if(tab === 1) busy = drawT1(t); else if(tab === 2) busy = drawT2(t); else if(tab === 3) busy = drawT3(t); else busy = drawT4(t, dt);
  if(dFx(t)) busy = true;
  if(busy) kick(); else lastT = 0;
}
document.addEventListener("visibilitychange", () => { lastT = 0; if(!document.hidden) kick(); });
window.addEventListener("resize", () => { resize(); });

$$("#t1cards .card").forEach(b => b.onclick = () => { S1.m = b.dataset.m; t1Clear(); t1UI(); });
function t1Geom(){
  const R = rectOf($("#t1beak")), sh = shakeOf("t1", T());
  const w = Math.min(R.w * .92, R.h * .8), h = Math.min(R.h - 24, w * 1.45);
  const x = R.x + (R.w - w) / 2 + sh, y = R.y + (R.h - h) / 2 + 8;
  const lh = h * .84, pad = w * .06;
  return {x, y, w, h, liq:{x:x + pad, y:y + h - lh + pad * .6, w:w - 2 * pad, h:lh - pad * 1.2}, rMax:Math.max(10, Math.min(26, w / 9))};
}
function t1Counts(){ const o = {}; MOL[S1.m].io.forEach(([sp]) => o[sp] = 0); S1.P.forEach(p => { if(p.arrived) o[p.sp]++; }); return o; }
function t1Retarget(anim){
  if(!$("#t1beak").offsetWidth) return;
  const G = t1Geom(), g = gridSlots(S1.P.length, G.liq, G.rMax), t = T();
  S1.P.forEach((p, i) => {
    const s = g.pts[i];
    if(p.fresh){ p.k[p.k.length - 1] = Object.assign(p.k[p.k.length - 1], {x:s.x, y:s.y, r:g.r}); p.fresh = false; return; }
    const cur = posAt(p, t);
    p.k = anim ? [{t, x:cur.x, y:cur.y, r:cur.r, a:1}, {t:t + .3, x:s.x, y:s.y, r:g.r, a:1}] : [{t, x:s.x, y:s.y, r:g.r, a:1}];
  });
  kick();
}
function t1Add(count, delay0){
  const per = Math.max(...MOL[S1.m].io.map(x => x[1])), cap = Math.floor(MAXI / per);
  count = Math.min(count, cap - S1.n);
  if(count <= 0){ shake("t1"); badFx(null); return 0; }
  const G = t1Geom(), t0 = T() + (delay0 || 0), rc = Math.max(G.rMax * .75, 9);
  for(let i = 0; i < count; i++){
    const ts = t0 + i * (count > 3 ? .07 : .12), cx = G.x + G.w * (.3 + Math.random() * .4);
    const top = G.y - rc * 1.5, surf = G.liq.y + rc * .6;
    molPos(S1.m, cx, 0, rc, false).forEach((q, j) => {
      const sp = molPos(S1.m, cx, 0, rc, true)[j];
      const p = {sp:q.sp, fresh:true, late:true, k:[
        {t:ts, x:q.x, y:top + q.y, r:rc}, {t:ts + .26, x:q.x, y:surf + q.y, r:rc},
        {t:ts + .36, x:sp.x, y:surf + sp.y + rc * .3, r:rc}, {t:ts + .8, x:0, y:0, r:rc}]};
      S1.P.splice(Math.floor(Math.random() * (S1.P.length + 1)), 0, p);
      setTimeout(() => { p.arrived = true; t1Count(); }, (ts - T() + .3) * 1000);
    });
    if(i < 12) setTimeout(() => snd("pop"), (ts - T() + .27) * 1000);
  }
  S1.n += count;
  t1Retarget(true);
  $("#t1hint").classList.add("hide");
  return count;
}
function t1Clear(){ S1.P = []; S1.n = 0; t1Count(); kick(); }

}

function t1NewQ(){ S1.q = genSplit(); S1.m = S1.q.m; S1.step = 0; S1.busy = false; t1Clear(); t1UI(); kick(); }

function t2Geom(){
  const R = rectOf($("#t2beak")), hw = R.w / 2, lab = Math.min(30, R.h * .09), bars = R.h * .3;
  const halves = [0, 1].map(i => {
    const A = {x:R.x + i * hw + hw * .12, y:R.y + lab + 6, w:hw * .76, h:R.h - lab - bars - 12};
    const B = beakerIn(A, 5.4, 0, Math.min(A.w, A.h * .85));
    B.x += shakeOf("t2" + i, T());
    return {B, lab:{x:R.x + i * hw + hw / 2, y:R.y + lab / 2 + 2}, bar:{x:R.x + i * hw + 6, y:R.y + R.h - bars, w:hw - 12, h:bars - 2}};
  });
  return {R, halves, lab};
}
function barPos(bar, n, r, i){ const cols = 10, L = Math.min(40, bar.w * .2);
  return {x:bar.x + L + (i % cols + .5) * 2.15 * r, y:bar.y + (Math.floor(i / cols) + .5) * 2.2 * r, L}; }
function drawT2(t){
  if(!S2.q) return false;
  const G = t2Geom(), q = S2.q, sols = [q.A, q.B], ns = [q.nA, q.nB];
  const rb = Math.min(...G.halves.map(h => Math.min((h.bar.w - Math.min(40, h.bar.w * .2)) / 21.5, h.bar.h / 6.6)));
  let busy = false;
  G.halves.forEach((h, i) => {
    txt((i ? "(나) " : "(가) ") + MOL[sols[i].m].f, h.lab.x, Math.max(h.lab.y, h.B.y - G.lab * .75), Math.max(14, Math.min(28, G.lab * .7)), "#ececee");
    const glow = S2.rev ? (q.ans === 1 || q.ans === i * 2 ? "#4ade80" : null) : null;
    if(!S2.rev){ dSolBeaker(sols[i], h.B, {dim:q.sp}); return; }
    dSolBeaker(sols[i], h.B, {skip:q.sp, dim:q.sp, glow});
    const src = layoutSol(sols[i], h.B).filter(p => p.sp === q.sp);
    src.forEach((p, j) => {
      const d = S2.t0 + j * .025, e = d + .55, b = barPos(h.bar, ns[i], rb, j);
      if(t < e) busy = true;
      const u = ease((t - d) / (e - d));
      dIon(q.sp, p.x + (b.x - p.x) * u, p.y + (b.y - p.y) * u, p.r + (rb - p.r) * u);

    const endT = S2.t0 + src.length * .025 + .55;
    if(t < endT) busy = true;
    if(t >= endT){ const b = barPos(h.bar, ns[i], rb, 0); txt(String(ns[i]), h.bar.x + b.L / 2, h.bar.y + rb * 1.1, Math.max(16, rb * 1.9), "#fff"); }
  });

}

function mixGroups(r){ return r.order.map(sp => ({sp, n:r.rem[sp]})).concat(r.water ? [{sp:"W", n:r.water}] : []); }

function drawT3(t){

    if(!m){ dSolBeaker(o, B); return; }
    dBeaker(B.x, B.y, B.w, B.h, {level:o.c * B.cellH / B.h * (1 - ease(pour)), cells:o.c, col:BTB[i ? "B" : "A"]});
  });

    dBeaker(M.x, M.y, M.w, M.h, {level:0, target:S3.mode === 1 ? M.total / M.cap : 0});
    dThermo(G.th.x, G.th.y, G.th.w, G.th.h, .08);

  const col = mixCol(BTB.X, BTB[r.nature], u2);

  let made = 0; (m.drops || []).forEach(d => { if(t >= d.ts) made++; });
  if(m.done) made = r.water;

}
function mixCol(c1, c2, u){

const S4 = {state:"idle", clock:0, score:0, combo:0, maxCombo:0, q:null, wrong:[], retry:[], lock:false, best:CS.store.get("n2_best", 0), pickT:0, pick:-1};

function drawQ(q, R, t){
  const fs = Math.max(15, Math.min(30, Math.min(R.w, R.h) * .07));
  if(q.type === "mi"){
    const r = Math.min(R.h * .2, R.w / 14, 54), cy = R.y + R.h / 2, x0 = R.x + (R.w - 13.2 * r) / 2;
    molPos(q.m, x0 + 2.5 * r, cy, r, false).forEach(p => dIon(p.sp, p.x, p.y, r));
    txt("×" + q.n, x0 + 5.3 * r, cy, r * 1.2, "#fff", "left", 900);
    txt("→", x0 + 9.3 * r, cy, r * 1.2, "#9a9aa2");
    dIon(q.sp, x0 + 11.9 * r, cy, r * 1.05);
    badge("?", x0 + 11.9 * r + r * .9, cy - r * .9, r * .6, "#fcd34d", "#422006");
    return;
  }
  if(q.type === "cmp"){
    const hw = R.w / 2, top = fs * 2.6;
    dIon(q.sp, R.x + R.w / 2 - fs * .7, R.y + fs * 1.1, fs * 1.0); txt("?", R.x + R.w / 2 + fs * .9, R.y + fs * 1.1, fs * 1.6, "#fff", "center", 900);
    [q.A, q.B].forEach((s, i) => {
      const A = {x:R.x + i * hw + hw * .1, y:R.y + top + fs * 1.4, w:hw * .8, h:R.h - top - fs * 1.4 - 4};
      const B = beakerIn(A, 5.3, s.c, Math.min(A.w, A.h * .9));
      txt((i ? "(나) " : "(가) ") + MOL[s.m].f, R.x + i * hw + hw / 2, B.y - fs * .9, fs, "#ececee");
      dSolBeaker(s, B, {dim:q.sp});
    });
    return;
  }
  // 섞기 문제: 산 비커 + 염기 비커 → 결과(?)
  const wide = R.w > R.h * 1.5;
  const Rb = wide ? {x:R.x, y:R.y, w:R.w * .66, h:R.h} : {x:R.x, y:R.y, w:R.w, h:R.h * .74};
  const Rt = wide ? {x:R.x + R.w * .68, y:R.y, w:R.w * .32, h:R.h} : {x:R.x, y:R.y + R.h * .76, w:R.w, h:R.h * .24};

    const A = {x:Rb.x + j * (bw + pw), y:Rb.y + fs * 1.5, w:bw, h:Rb.h - fs * 1.5 - 4};
    const B = beakerIn(A, 5.3, s.c, Math.min(A.w * .92, A.h * .95));
    txt(MOL[s.m].f, A.x + A.w / 2, B.y - fs * .9, fs, "#ececee");
    dSolBeaker(s, B);
  });
  txt("+", Rb.x + bw + pw / 2, Rb.y + Rb.h * .6, Math.min(34, pw * .8), "#9a9aa2");
  const cx = Rt.x + Rt.w / 2, cy = Rt.y + Rt.h / 2, s = Math.min(Rt.h * .42, Rt.w * .3, 60);
  if(q.type === "col"){
    dBeaker(cx - s * .8, cy - s * .8, s * 1.6, s * 1.6, {level:.75, col:"#3a3a40", alpha:.6});
    txt("?", cx, cy + s * .15, s * .9, "#fff", "center", 900);
  } else if(q.type === "rem"){
    txt("?", cx, cy, s * 1.2, "#fff", "center", 900);

  } else if(q.type === "wat"){
    dDrop(cx - s * .45, cy + s * .1, s * .55); txt("?", cx + s * .55, cy, s * 1.1, "#fff", "center", 900);
  } else if(q.type === "rat"){
    const k = q.r.order.length, rr = Math.min(s * .5, Rt.w / (k * 3.4 + 2.5)), gap = rr * 3.3, x0 = cx - ((k - 1) * gap + rr * 2.5) / 2;
    q.r.order.forEach((sp, i) => { dIon(sp, x0 + i * gap, cy, rr); if(i < k - 1) txt(":", x0 + i * gap + gap / 2, cy, rr * 1.4, "#fff", "center", 900); });
